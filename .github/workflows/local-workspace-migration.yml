name: Local workspace migration gate

on:
  pull_request: {}

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check:workspace-boundary --legacy-peer-deps
      - name: Complete unit suite
        run: npx vitest run --maxWorkers=4
      - run: npm run build --legacy-peer-deps
      - name: Browser migration matrix
        run: >-
          npx playwright test tests/e2e/local_workspace_migration.spec.js
          --project=chromium
          --project=firefox
          --project=webkit
          --project=workspace-large-chromium
          --project=workspace-large-firefox
      - name: Built Chromium Worker save proof
        env:
          E2E_BUILT_BUNDLE: '1'
          E2E_BUILT_WORKER_COMPLETION_MARKER: ${{ runner.temp }}/built-worker-proof-complete.json
        run: |
          rm -f "$E2E_BUILT_WORKER_COMPLETION_MARKER"
          npx playwright test tests/e2e/local_workspace_migration.spec.js \
            --project=chromium \
            --grep="coalesces near-limit built-editor interactions before one module-Worker save$" \
            --workers=1 \
            --retries=0
          test -s "$E2E_BUILT_WORKER_COMPLETION_MARKER"
      - name: Upload Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-workspace-playwright-report
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
