[vid]);\n    for (const vid of cs.variantsRemoved) delete merged.variants[vid];\n    for (const [vid, newName] of Object.entries(cs.variantsRenamed)) {\n        if (merged.variants[vid]) merged.variants[vid].name = newName;\n    }\n    const applyTemplates = (map, fn) => {\n        for (const [vid, tids] of Object.entries(map)) {\n            if (!merged.variants[vid]) continue;\n            for (const tid of tids) fn(vid, tid);\n        }\n    };\n    applyTemplates(cs.templatesAdded, (vid, tid) => { merged.variants[vid].templates[tid] = clone(source.variants[vid].templates[tid]); });\n    applyTemplates(cs.templatesModified, (vid, tid) => { merged.variants[vid].templates[tid] = clone(source.variants[vid].templates[tid]); });\n    applyTemplates(cs.templatesRemoved, (vid, tid) => { delete merged.variants[vid].templates[tid]; });\n\n    if (!merged.variants[merged.activeVariantId]) {"},{"id":"textlayout-engine","file":"services/textLayout.ts","startLine":431,"code":"export function createTextLayoutEngine(\n    cacheLimit: number = TEXT_LAYOUT_CACHE_LIMIT,\n): TextLayoutEngine {\n    const layoutCache = new BoundedLruCache\u003cstring, TextLayoutResult | null>(cacheLimit);\n    const graphemeCache = new BoundedLruCache\u003cstring, readonly string[]>(cacheLimit);\n    const graphemesFor: GraphemeLookup = text => {\n        const cached = graphemeCache.get(text);\n        if (cached !== undefined) return cached;\n\n        const graphemes = Object.freeze(segmentGraphemes(text));\n        graphemeCache.set(text, graphemes);\n        return graphemes;\n    };\n\n    return {\n        layout(request, measurer) {\n            if (\n                request.text.length === 0\n                || !Number.isFinite(request.fontSize)\n                || request.fontSize \u003c= 0\n                || !Number.isFinite(request.contentWidth)\n                || request.contentWidth \u003c= 0\n                || !Number.isFinite(request.contentHeight)\n                || request.contentHeight \u003c= 0\n            ) {\n                return null;\n            }\n\n            const normalizedRequest = normalizeRequest(request);\n            const key = JSON.stringify([measurer.cacheKey, normalizedRequest]);"},{"id":"sandbox-parse","file":"services/generatorSandbox.ts","startLine":43,"code":"const parseMessage = (message: unknown, requestToken: string): GeneratorSandboxResult | null => {\n    if (!isRecord(message) || message.requestToken !== requestToken) return null;\n    if (message.type !== RESULT_TYPE || typeof message.ok !== 'boolean') {\n        return { ok: false, category: 'protocol', message: 'Sandbox returned a malformed protocol message.' };\n    }\n    if (message.ok) {\n        if (!isRecord(message.value) || !Object.hasOwn(message.value, 'templates') || !Object.hasOwn(message.value, 'hierarchy')) {\n            return { ok: false, category: 'protocol', message: 'Sandbox result is missing templates or hierarchy.' };\n        }\n        return { ok: true, value: { templates: message.value.templates, hierarchy: message.value.hierarchy } };\n    }\n    if (typeof message.category !== 'string' || !FAILURE_CATEGORIES.has(message.category) || typeof message.message !== 'string') {\n        return { ok: false, category: 'protocol', message: 'Sandbox returned a malformed failure.' };\n    }\n    return {\n        ok: false,\n        category: message.category as 'runtime' | 'clone',\n        message: message.message,\n    };\n};\n"},{"id":"migration-trigger","file":"server/migrations/index.js","startLine":375,"code":"        id: '012_session_suspension_guard',\n        pg: [\n            `CREATE OR REPLACE FUNCTION guard_session_insert_for_suspension()\n             RETURNS trigger AS $$\n             DECLARE\n                 referenced_banned BOOLEAN;\n                 referenced_ban_expires TIMESTAMP;\n             BEGIN\n                 SELECT banned, \"banExpires\"\n                 INTO referenced_banned, referenced_ban_expires\n                 FROM \"user\"\n                 WHERE id = NEW.\"userId\"\n                 FOR UPDATE;\n                 IF referenced_banned AND (referenced_ban_expires IS NULL OR referenced_ban_expires > CURRENT_TIMESTAMP) THEN\n                     RAISE EXCEPTION 'session creation blocked for suspended user';\n                 END IF;\n                 RETURN NEW;\n             END;\n             $$ LANGUAGE plpgsql`,\n            'DROP TRIGGER IF EXISTS session_suspension_guard ON session',\n            `CREATE TRIGGER session_suspension_guard\n                BEFORE INSERT ON session\n                FOR EACH ROW EXECUTE FUNCTION guard_session_insert_for_suspension()`,\n        ],\n        sqlite: [\n            'DROP TRIGGER IF EXISTS session_suspension_guard',\n            `CREATE TRIGGER session_suspension_guard\n                BEFORE INSERT ON session\n                WHEN EXISTS (\n                    SELECT 1 FROM \"user\""},{"id":"publish-route","file":"server/routes/projects.js","startLine":383,"code":"router.post('/api/projects/:id/publish', requireAuth, requireUsername, loadProject(true), async (req, res) => {\n    const expectedHead = expectedHeadFromRequest(req, res);\n    if (expectedHead === null) return;\n    const listing = parseListingFields(req.body);\n    if (listing.error) return res.status(400).json({ error: listing.error });\n    if (!listing.previews) {\n        return res.status(400).json({ error: PREVIEW_COUNT_ERROR });\n    }\n    const parsedTags = listing.tags;\n    const d = listing.description ?? '';\n\n    let published;\n    try {\n        published = await withTransaction(async txQuery => {\n            const lockSuffix = dbType === 'postgres' ? ' FOR UPDATE' : '';\n            // Serialize first-publish allowance checks per owner before locking a project.\n            await txQuery(`SELECT id FROM \"user\" WHERE id = $1${lockSuffix}`, [req.user.id]);\n            const current = await txQuery(`SELECT * FROM projects WHERE id = $1${lockSuffix}`, [req.project.id]);\n            if (!current[0] || current[0].head_commit_id !== expectedHead) return null;\n            if (current[0].visibility !== 'public') await assertPublishAllowance(req.user.id, txQuery);\n\n            const updated = await txQuery(\n                `UPDATE projects SET visibility = 'public', published_commit_id = $1,\n                     published_name = name, published_description = $2, published_tags = $3,\n                     published_at = CURRENT_TIMESTAMP, description = $4, tags = $5,\n                     updated_at = CURRENT_TIMESTAMP"},{"id":"validate-appstate","file":"shared/validateAppState.js","startLine":25,"code":"export const validateAppState = (state) => {\n    if (!isObj(state)) return fail('state must be an object');\n    const nodes = ownEnumerableDataValue(state, 'nodes');\n    if (!isObj(nodes)) return fail('nodes must be an object');\n    const rootId = ownEnumerableDataValue(state, 'rootId');\n    if (!isStr(rootId) || !isObj(ownEnumerableDataValue(nodes, rootId))) {\n        return fail('rootId must reference an existing node');\n    }\n\n    let serialized;\n    try { serialized = JSON.stringify(state); }\n    catch { return fail('state is not serializable'); }\n    if (serialized === undefined) return fail('state is not serializable');\n    if (utf8ByteLength(serialized) > MAX_STATE_BYTES) {\n        return fail(`state exceeds ${MAX_STATE_BYTES} bytes`);\n    }\n\n    if (state.generator !== undefined) {\n        const generatorResult = validateGeneratorProvenance(state.generator, { strictUnknownFields: true });\n        if (!generatorResult.ok) return fail(generatorResult.message);\n    }\n\n    if (Object.keys(nodes).length > MAX_NODES) return fail('too many nodes (max 20000)');\n"},{"id":"email-seal","file":"server/email.js","startLine":2,"code":"// Fail-safe: no RESEND_API_KEY => log the message (incl. any links) to the\n// console and resolve. This keeps dev working with zero setup while never\n// weakening auth: callers treat email as sent either way, and sign-in\n// verification blocking is enforced independently of delivery.\n\nlet injectedImpl = null;\n\n/** Test hook: replace delivery. Pass null to restore real behavior. */\nexport const setSendEmailImpl = (fn) => { injectedImpl = fn; };\n\nexport async function sendEmail({ to, subject, html, text }) {\n    if (injectedImpl) return injectedImpl({ to, subject, html, text });\n\n    const apiKey = process.env.RESEND_API_KEY;"},{"id":"auth-hooks","file":"server/auth.js","startLine":98,"code":"        databaseHooks: {\n            user: {\n                create: {\n                    before: async (user) => {\n                        let open = true;\n                        try {\n                            open = await isSignupOpen();\n                        } catch (error) {\n                            // Fail open: a broken counter must not lock signups entirely.\n                            console.error('Signup cap check failed:', error);\n                        }\n                        if (!open) {\n                            throw new APIError(\"FORBIDDEN\", { message: SIGNUP_CAP_MESSAGE, code: \"SIGNUP_CAP_REACHED\" });\n                        }\n                        return { data: user };\n                    },\n                    after: async (user) => {\n                        try {\n                            await reconcileOwnerAuthority({ userId: user.id });\n                        } catch (error) {\n                            console.error('Owner signup reconciliation failed:', error);\n                        }\n                    }\n                }\n            }\n        },\n        hooks: {\n            before: createAuthMiddleware(async (ctx) => {\n                if (ctx.path === \"/admin\" || ctx.path.startsWith(\"/admin/\")) {\n                    throw new APIError(\"NOT_FOUND\", { message: \"Not found\", code: \"NOT_FOUND\" });"},{"id":"spa-fallback","file":"server/app.js","startLine":86,"code":"        // Must pass a relative filename + { root } rather than an absolute path: express@5.2.1's\n        // res.sendFile() 404s on a bare absolute path here even when the file exists, silently\n        // breaking every hard/direct load (deep link, bookmark, refresh) of any non-root client\n        // route in production. { root } is also express's own recommended sendFile pattern.\n        res.sendFile('index.html', { root: distPath });\n    });\n\n    return app;"}]}, content: {"intro":{"about":["PDF Architect is a local-first editor for structured PDF products — planners, journals, trackers, gamebooks — aimed at e-ink tablets (the flagship page size is the reMarkable Paper Pro’s 509×679 pt). A document is a hierarchy of nodes; each node renders through a template; templates carry elements (text, rectangles, lines, SVG artwork, dynamic grids, smart links); variants are alternate template sets over the same hierarchy — one document, many looks.","Everything works without an account: IndexedDB, accessed through LocalWorkspaceStore, is local document authority and PDF export runs client-side through jsPDF. Cloud storage remains explicit opt-in — signing in exposes the controls, but only a user-triggered save sends an immutable, gzip’d full-snapshot commit. The account layer also adds publishing to a public gallery, GitHub-style forking, and merge requests judged by a structured three-way diff — the same engine the server enforces at merge time.","It is one repo with no monorepo tooling: the React 19 + Vite client sits at the root (components/, pages/, services/, hooks/), the Express 5 server in server/ (SQLite in dev, Postgres in prod, versioned run-once migrations), and shared/ holds plain-ESM code either side can import (password policy, generator metadata, project limits). The diff engine lives there too, but only the server imports it today — the client just renders the ChangeSet it gets back.","Two production ideas dominate the codebase: nothing public ever tracks your private working head (publishing pins an explicit published commit), and nothing that came from someone else ever executes or renders unsanitized (the generator sandbox, DOMPurify at the single SVG render site)."],"run":[{"cmd":"npm run dev","note":"Vite client :3000 + Express API :3001, concurrently"},{"cmd":"npm test","note":"Vitest unit suite (jsdom) — the 2,900+ test wall every round leans on"},{"cmd":"npm run test:e2e","note":"Playwright end-to-end across five configured projects: three browsers plus two large-workspace storage profiles; boots its own server"},{"cmd":"node docs-capture/run.js \u003ctrack>","note":"regenerate the in-app docs screenshots from a live scripted app"},{"cmd":"node onboarding/build.mjs","note":"regenerate this page from the current repo"},{"cmd":"npm run build","note":"production client build into dist/, served by the Express fallback route"}],"houseMethod":{"text":["Every feature round runs the same pipeline: a brainstorm settles the design decisions, a spec records them (docs/superpowers/specs/), a plan breaks the work into bite-sized tasks (docs/superpowers/plans/), and each task is implemented test-first by a fresh worker who sees only that task’s brief — then independently reviewed before the next task starts. After all tasks land, one more review reads the whole branch as a single system.","The whole-branch review exists because some bugs are structurally invisible to a per-task view. The proof is in the catches on the right — each was found only when someone looked at everything at once."],"stages":["brainstorm","spec","plan","implement (TDD, fresh worker per task)","independent per-task review","whole-branch review"],"catches":["A pre-existing unsanitized SVG path became stored cross-user XSS the moment publishing and forking existed — found by the first whole-branch review, fixed with DOMPurify at the one render site, verified with a live exploit before and after.","The entire 108-file docs corpus was being statically imported into the main bundle and parsed on every route — a landing-page regression no docs task could see; fixed by lazy-loading the docs chunk.","Profile pages silently lost every thumbnail: one task omitted the field, another added the defensive default that hid the crash, and no task owned the visual outcome. Caught whole-branch, fixed at the endpoint."]},"roundLabels":{"2026-07-04-username-identity-design.md":"Public username identity","2026-07-04-login-redirect-and-gallery-pdf-download-design.md":"Sign-in redirect + gallery zip download","2026-07-05-gallery-detail-modal-design.md":"Gallery projects as overlay modals","2026-07-05-gallery-version-history-design.md":"Public version history","2026-07-06-gallery-v2-ratings-reviews-filters-design.md":"Ratings, reviews, tag browsing","2026-07-08-layers-panel-design.md":"Named layers + stacked selection","2026-07-09-password-policy-design.md":"Password policy","2026-07-09-email-verification-design.md":"Email verification (and the dotenv seals)","2026-07-13-generator-source-persistence-design.md":"Generator source persistence + sandbox","2026-07-16-account-moderation-design.md":"Account moderation (audit triggers)","2026-07-16-owner-moderator-authority-design.md":"Owner above the moderators","2026-07-18-text-overflow-rendering-design.md":"Text overflow: one layout engine","2026-07-19-signup-cap-waitlist-design.md":"Signup cap + waitlist","2026-07-19-docs-overhaul-design.md":"The /docs documentation product","2026-07-25-gallery-listing-editing-design.md":"Editing a published listing","2026-08-04-gallery-discoverability-design.md":"Gallery discoverability redesign","2026-08-06-gallery-all-projects-directory-design.md":"All-projects directory","2026-08-07-dev-onboarding-playground-design.md":"This playground"}},"tours":[{"id":"local-first","title":"Local-first: a project’s life in the browser","blurb":"No account and no server required: IndexedDB remains local document authority; cloud storage is explicit opt-in through Save to cloud.","diagram":["{{gate:WorkspaceBootstrapGate}} ──ready──▶ {{ui:EditorPage}} ──edits──▶ {{state:AppState (schema v11)}}","          │ bootstrap                         │                        ├──▶ {{canvas:DOM canvas}} ──▶ {{pdf:jsPDF export}}","          ▼                                   ▼                        └──▶ {{gen:generator scripts}}","{{store:LocalWorkspaceStore}} ◀──commit── {{writes:useWorkspaceProjectWrites}}","          │ six-store atomic writes","          ▼","{{idb:IndexedDB authority}} ◀──verified── {{mig:migration}} ◀──read-only── {{legacy:legacy localStorage}}"],"steps":[{"text":"Everything the editor knows is one JSON document: AppState. Nodes form the page hierarchy, variants hold template sets, templates hold elements, layers tag elements without restructuring them, and an optional generator block carries the scripts that produced the document.","files":["types.ts"],"highlight":["state"]},{"text":"WorkspaceBootstrapGate owns /app startup. It calls LocalWorkspaceStore.bootstrap and does not mount EditorPage until an independently verified ready snapshot exists; opening, migration, unavailable storage, and recovery stay outside the editor.","files":["App.tsx","components/workspace/WorkspaceBootstrapGate.tsx","services/localWorkspace/contracts.ts"],"highlight":["gate","store","ui"]},{"text":"The three-method LocalWorkspaceStore boundary — bootstrap, commit, and exportRecoveryBundle — hides transactions and recovery state. Initial migration writes all six IndexedDB stores atomically: projects, workspace, presets, pendingImports, migrationLedger, and legacyBackup. Independent read-back and a verified ledger switch authority.","files":["services/localWorkspace/LocalWorkspaceStore.ts","services/localWorkspace/contracts.ts","services/localWorkspace/indexedDbAdapter.ts","services/localWorkspace/schema.ts"],"highlight":["store","idb","mig"]},{"text":"ProjectEditor reports edits to EditorPage, which sends them through useWorkspaceProjectWrites. The hook keeps the newest working copy visible while LocalWorkspaceStore coalesces saves in a per-project queue. IndexedDB checks private incarnation plus storageRevision with compare-and-swap (CAS), and a complete read-back installs each success; failed work remains available to retry or download.","files":["components/ProjectEditor.tsx","pages/EditorPage.tsx","hooks/useWorkspaceProjectWrites.ts","services/localWorkspace/mutationQueue.ts","services/localWorkspace/indexedDbAdapter.ts"],"highlight":["ui","state","writes","store","idb"]},{"text":"Project preparation performs source-shape validation first (including full AppState validation for schema v10/v11), then schema migration through loadProjectState and migrateState, final validation and normalization, and only then persistence. Legacy localStorage document keys are retained only as read-only migration and recovery input. Epoch 1 has no cleanup, fallback, or dual-write path; old-tab or rollback drift blocks editing and preserves both sources instead of choosing a winner.","files":["services/loadProjectState.ts","services/migration.ts","services/localWorkspace/legacy.ts","services/localWorkspace/LocalWorkspaceStore.ts"],"highlight":["mig","legacy","idb"]},{"text":"The canvas is not a \u003ccanvas> — it is absolutely-positioned DOM. That choice is why thumbnails need the PDF pipeline (you cannot screenshot a DOM canvas), and why editor chrome uses an isolation:isolate wrapper so user z-indexes can never paint over selection boxes. PDF export remains entirely client-side through jsPDF and shares text layout decisions with the canvas.","files":["components/Canvas.tsx","components/canvas/CanvasElement.tsx","components/canvas/ReadOnlyPagePreview.tsx","services/pdfService.ts","services/textLayout.ts"],"highlight":["state","canvas","pdf"]},{"text":"The Hierarchy Generator describes a whole product as two JavaScript programs. Since schema v9 they persist inside AppState — and because opening someone else’s project must never execute their code, preview runs in a sandboxed iframe + disposable worker, never in the app realm.","files":["components/HierarchyGeneratorModal.tsx","services/generatorSandbox.ts"],"highlight":["state","gen"]}]},{"id":"cloud-save","title":"Save to cloud: commits and the If-Match dance","blurb":"Every save is an immutable full snapshot; heads advance by compare-and-swap.","diagram":["{{menu:CloudMenu}} ─▶ {{api:cloudApi.ts}} ─▶ {{route:POST /api/projects/:id/commits}}","                                              │ If-Match: \u003chead tag>","                                              ▼","{{val:validateAppState}} ─▶ {{codec:stateCodec gzip}} ─▶ {{cas:CAS head advance}}","                                              │ stale? ──▶ {{409:409 conflict}}"],"steps":[{"text":"The Cloud menu is a three-way branch: signed out, signed in without a username, signed in with one. The username gate exists because every commit carries a public handle — and it is deliberately absent from routes that only reduce exposure (unpublish, delete), so legacy accounts can always clean up.","files":["components/cloud/CloudMenu.tsx"],"highlight":["menu"]},{"text":"Every server call the cloud features make goes through one typed wrapper: services/cloudApi.ts. When you add an endpoint, it gets a function here — no fetch calls scattered through components.","files":["services/cloudApi.ts"],"highlight":["api"]},{"text":"A commit is a full snapshot, not a diff — that decision (made before any code) is why version history, restore, fork, and merge are all simple reads of one row.","files":["server/routes/projects.js"],"highlight":["route"]},{"text":"Before anything is stored, the browser-safe implementation in shared/validateAppState.js checks shape, a 5 MB size cap, and node/element count caps; server/validateAppState.js remains its compatibility re-export. The server has exactly three call sites — project create, commits, and the merged result at the end of a merge. Publish is not one of them: it takes listing fields and an If-Match head, never a state.","files":["shared/validateAppState.js","server/validateAppState.js","server/routes/projects.js","server/routes/mergeRequests.js"],"highlight":["val"]},{"text":"Snapshots are gzip’d by stateCodec on write and inflated on read. insertCommit (server/routes/projects.js) stamps an app-generated millisecond created_at because SQLite’s CURRENT_TIMESTAMP has whole-second resolution: without it, two saves in one second would tie and “newest first” would fall through to a random UUID id. This one never shipped broken — the commit that first built the history API already carried the stamp and the ORDER BY it protects.","files":["server/stateCodec.js","server/routes/projects.js"],"highlight":["codec"]},{"text":"Saves carry a strong If-Match head tag; the server advances the head by transactional compare-and-swap. A stale save gets a stable 409 and leaves no orphan commit. CORS had to explicitly admit the If-Match header for any of this to work cross-origin.","files":["server/routes/projects.js","server/projectLocks.js","server/app.js"],"highlight":["cas","409"]}]},{"id":"publish","title":"Publish: the pinned snapshot","blurb":"Public means the version you published — never your live working head.","diagram":["{{wizard:PublishModal}} ─▶ {{thumbs:thumbnails: jsPDF → pdfjs → WebP}}","        │","        ▼","{{pub:POST …/publish}} ─ validate → lock → write ─▶ {{pin:published_commit_id}}","        │                                             ▲","{{edit:PATCH …/publication}} ── metadata only, never moves ┘","{{gal:gallery readers}} ──── only ever see the pin"],"steps":[{"text":"The publish wizard collects a description, tags, and up to six preview pages, and renders the previews live before you commit to anything. Preview selection re-renders from the published commit — never from your working state — so the shop window can never advertise a page the download doesn’t contain.","files":["components/cloud/PublishModal.tsx","components/cloud/PreviewPagePicker.tsx"],"highlight":["wizard"]},{"text":"Thumbnails exist because the DOM canvas can’t be screenshotted: render to an in-memory PDF (jsPDF), rasterize with pdfjs-dist, downscale to WebP. The server re-validates every image by magic bytes and caps them at 300 KB.","files":["services/thumbnailService.ts","server/routes/projects.js"],"highlight":["thumbs"]},{"text":"Publishing validates, locks, and writes inside one transaction (withTransaction pins a Postgres client and serializes SQLite under BEGIN IMMEDIATE).","files":["server/routes/projects.js","server/projectLocks.js","server/db.js"],"highlight":["pub"]},{"text":"The load-bearing column: published_commit_id. Ordinary saves and merges advance only the private head; public content changes only on explicit republish. This model exists because a whole-branch review caught gallery readers being served the live head — a disclosure hazard once generator source became public.","files":["server/migrations/index.js"],"highlight":["pin"]},{"text":"Listing metadata (name, description, tags) is pinned at publish time too — privately renaming a project stopped silently renaming its gallery card. A later round added PATCH /api/projects/:id/publication: edit the listing without republishing, guarded by a composite If-Match token (published_commit_id AND published_at, because republishing an unchanged commit is legal).","files":["server/routes/projects.js","shared/publicationTag.js","components/cloud/EditListingModal.tsx"],"highlight":["edit"]},{"text":"Everything a gallery reader touches — detail, download, open-in-editor, fork — resolves the published commit. “Recently updated” sorts by published_at, which metadata edits deliberately never move: keeping a listing tidy must not be free promotion.","files":["server/routes/gallery.js"],"highlight":["gal"]}]},{"id":"fork-merge","title":"Fork → merge request: the three-way diff at work","blurb":"One plain-JS engine, server-side: it recomputes the diff on every view of the request and enforces it again at merge time. The client renders what comes back.","diagram":["{{up:upstream (public)}} ──fork──▶ {{fork:private fork + lineage}}","     │  base = common ancestor         │ edits, saves","     ▼                                 ▼","{{mr:merge request}} ◀──propose── {{head:fork head commit}}","     │ diff recomputed LIVE on every view","     ▼","{{tw:threeWayDiff}} ─ conflicts? ─▶ {{merge:merge under lock}} / {{block:refuse}}"],"steps":[{"text":"Forking a public project — including your own — copies the published commit into a brand-new private project, recording exactly which project and commit it came from. Forks never appear in the gallery.","files":["server/routes/projects.js"],"highlight":["up","fork"]},{"text":"A merge request proposes the fork’s head back upstream. The review page shows a structured change list — templates and variants, not text lines — plus a rendered before/after preview.","files":["server/routes/mergeRequests.js","pages/MergeRequestPage.tsx"],"highlight":["mr","head"]},{"text":"The diff is recomputed live every time the request is viewed — never a stale snapshot — so a request that becomes conflicted after the fact (upstream changed the same thing) is caught before anyone clicks merge.","files":["server/routes/mergeRequests.js"],"highlight":["mr"]},{"text":"threeWayDiff compares the fork’s changes and upstream’s changes against their common ancestor. Six genuine conflict classes, and only these six: same template edited differently, a variant removed on one side and modified on the other, a variant added on both sides with different content, a variant renamed differently on both sides, the node hierarchy changed differently, and the generator — treated as one atomic value, never line-merged. Changes that do not overlap coexist.","files":["shared/diff.js"],"highlight":["tw"]},{"text":"Merging re-verifies no conflict immediately before writing, inside the same lock that pins the target head, refuses already-merged/closed requests, and runs the merged result back through the shared validateAppState implementation via its server compatibility re-export. The Merge button’s visibility comes from the server’s own isTargetOwner — the client once guessed “whoever isn’t the author” and broke on self-forks.","files":["server/routes/mergeRequests.js","shared/validateAppState.js","server/validateAppState.js"],"highlight":["merge","block"]},{"text":"A schema mismatch between fork and upstream deliberately blocks the diff until the fork re-saves on the current version — that guard is in the merge-request route, not the engine. The engine itself ignored the layers, overflow and padding schema changes entirely, because it diffs whole templates.","files":["server/routes/mergeRequests.js","shared/diff.js","services/migration.ts"],"highlight":["tw"]}]},{"id":"pdf-export","title":"Export: one text engine, two renderers","blurb":"Canvas and PDF used to each do their own text layout. Neither respected the box.","diagram":["{{req:element + box}} ─▶ {{engine:textLayout.ts (pure)}}","                          │ segmentation · wrap · ellipsis · shrink","            ┌─────────────┴─────────────┐","            ▼                           ▼","{{cadapt:canvas adapter}}         {{padapt:jsPDF adapter}}","            ▼                           ▼","{{dom:DOM canvas}}                {{doc:exported PDF}}  + {{svg:svg2pdf normalization}}"],"steps":[{"text":"services/textLayout.ts is renderer-independent: segmentation, greedy wrap, ellipsis, shrink-to-fit, block sizing — with text measurement injected, so the same decisions run everywhere. Four overflow modes (clip, ellipsis, shrink, visible) plus an independent wrap toggle.","files":["services/textLayout.ts","services/textOverflow.ts"],"highlight":["engine"]},{"text":"Two thin adapters: one over an offscreen canvas context, one over jsPDF width metrics. A parity suite feeds both identical fake metrics and asserts identical lines, truncation, and clip flags.","files":["services/canvasTextLayout.ts","services/pdfTextLayout.ts"],"highlight":["cadapt","padapt"]},{"text":"Quiet correctness lives here: the ellipsis search was a binary search over grapheme counts — which assumes measured width is monotonic in count; it isn’t guaranteed to be, so it became a linear scan. Greedy wrap was O(n²) re-measuring whole candidate lines and was rewritten single-pass, with tests asserting bounded measure-call counts.","files":["services/textLayout.ts","services/graphemes.ts"],"highlight":["engine"]},{"text":"Text padding: one 87-line module whose single geometry function, resolveTextContentBox, shrinks the box before the engine ever sees it. Canvas, the inline overlay editor, and PDF all consume the same content box.","files":["services/textPadding.ts"],"highlight":["req"]},{"text":"SVG export is a tree-transform pipeline before svg2pdf sees anything: hsl()/8-digit-hex normalized to rgb + opacity attributes (svg2pdf silently drops what it can’t parse), element opacity baked into the SVG’s own opacity scopes (svg2pdf replaces outer alpha rather than multiplying), grayscale as a desaturation pass with the full CSS named-color table.","files":["services/svgColorNormalize.ts"],"highlight":["svg"]},{"text":"Link annotations became a helper called from every element branch after svg and line elements silently skipped them — the shared doc.link() block sat below a continue. Byte-level tests read the annotations back out of the produced PDF.","files":["services/pdfService.ts"],"highlight":["doc"]}]},{"id":"signup","title":"A signup’s journey","blurb":"better-auth with app-owned choke points: cap, verification, username, admin-path denial.","diagram":["{{form:signup form / Google OAuth}} ─▶ {{auth:better-auth /api/auth/*}}","                                        │ databaseHooks.user.create.before","                                        ▼","{{cap:signup cap check}} ─ full? ─▶ {{wait:waitlist panel}}","     │ open","     ▼","{{verify:email verification}} ─▶ {{welcome:/welcome username gate}} ─▶ {{gated:content-creating routes}}"],"steps":[{"text":"better-auth mounts at /api/auth before express.json — its handler consumes its own bodies. Everything app-specific hangs off hooks, not forked library code.","files":["server/auth.js","server/app.js"],"highlight":["auth"]},{"text":"The signup cap lives in databaseHooks.user.create.before — the single choke point both email signup and first-time Google OAuth pass through; returning OAuth users never create a row, so they never hit it. Path-based middleware was rejected for exactly that OAuth blind spot.","files":["server/auth.js","server/signupCap.js"],"highlight":["cap"]},{"text":"Only verified accounts count toward the cap, and the counter fails open by design: a broken count query must not lock the front door. The waitlist endpoint treats duplicates as idempotent success so it never reveals membership.","files":["server/signupCap.js"],"highlight":["cap","wait"]},{"text":"Email delivery is one fail-safe module: Resend’s HTTP API when a key is configured, console logging when not — and a missing key never weakens sign-in blocking. The dotenv seals (present-but-empty, never delete) guard every test/tooling surface from sending real mail.","files":["server/email.js"],"highlight":["verify"]},{"text":"Accounts can exist with username = null (OAuth, legacy). /welcome blocks content creation until one is set; requireUsername guards the six routes that create or attach public content (project create, commits, publish, fork, merge-request create, reviews) — and deliberately not unpublish/delete/merge-close, so a legacy account can always clean up its own data.","files":["pages/WelcomePage.tsx","server/middleware/guards.js"],"highlight":["welcome","gated"]},{"text":"hooks.before also denies /admin/* inside better-auth — where it sees the normalized path. Express-level blocking was bypassable with percent-encoded dot-segments that normalized back to /admin/* inside the library; red tests proved unban and role promotion answered 200 to a non-admin before the fix.","files":["server/auth.js"],"highlight":["auth"]}]}],"codeMap":{"annotations":[{"path":"components","note":"React UI — editor shell, canvas, panels, modals; feature subdirs (canvas, cloud, docs, gallery, json, moderation, properties, sidebar)."},{"path":"pages","note":"Route-level components. EditorPage is the product; everything else orbits it."},{"path":"services","note":"Client logic kept DOM-light: PDF export, text layout, schema migrations, typed API wrapper, generator sandbox."},{"path":"server","note":"Express 5 API. app.js is the createApp() factory; index.js just boots it. SQLite in dev, Postgres in prod."},{"path":"server/routes","note":"Six route files — four core (me, projects, gallery, mergeRequests) plus the two moderation-era ones. Nearly every endpoint lives here; app.js keeps two of its own (/api/track, /api/stats) plus the SPA fallback. Rounds add endpoints to existing files — a new route file is rare and deliberate."},{"path":"server/migrations","note":"The migration ledger (index.js). NEVER edit an applied migration — append a new one. Three of them install database triggers: 011 and 014 make the audit tables append-only, 012 refuses sessions for suspended users."},{"path":"server/middleware","note":"checkOrigin (CSRF), rate limits, requireAdmin/requireOwner (live config membership on every request), requireUsername."},{"path":"shared","note":"Plain ESM imported by BOTH client and server — generator metadata and shared validation rules. The diff engine lives here too, but only the server imports it today."},{"path":"hooks","note":"Three React hooks: useCurrentUser (session), useGalleryDetail (shared by gallery page + modal), and useWorkspaceProjectWrites (working-copy publication and coalesced local saves)."},{"path":"lib","note":"Docs content loading/validation/search + the better-auth browser client."},{"path":"tests","note":"Component vitest suites flat in tests/unit, server suites in tests/unit/server, Playwright e2e in tests/e2e, shared helpers (incl. the gallery-sample harness) in tests/helpers."},{"path":"docs-content","note":"The in-app /docs product: 25 tutorials + 83 reference entries as markdown, validated at load — a bad link fails the unit suite."},{"path":"docs-capture","note":"Committed Playwright pipeline that regenerates all 64 docs assets — 50 PNG stills plus 14 animated WebP clips — deterministically (node docs-capture/run.js \u003ctrack>)."},{"path":"tutorial","note":"The video-tutorial production pipeline: storyboards, Chirp narration, paced recording, ffmpeg assembly."},{"path":"gallery-samples","note":"20 flagship sample products as generator scripts, validated by a committed harness (structure, links, bounds, example chrome)."},{"path":"docs/superpowers","note":"Specs and plans for every round — the paper trail of the house method. Read a spec before touching its feature."},{"path":"public","note":"Static assets, including the long-form project walkthrough this playground is distilled from."},{"path":"scripts","note":"Utility scripts (lighthouse audit runner)."},{"path":"onboarding","note":"This playground: authored src/ + build.mjs assembling the committed index.html you are reading."},{"path":"App.tsx","note":"All routes, statically imported (one main chunk by design; only /docs and the listing editor are lazy). The gallery modal’s background-location split lives here."},{"path":"index.tsx","note":"Client entry — mounts App under the router."},{"path":"types.ts","note":"AppState and every document type. Start reading the codebase here."},{"path":"components/ProjectEditor.tsx","note":"Editor shell: toolbar, canvas, right-hand panels, selection model, undo checkpoints."},{"path":"components/Canvas.tsx","note":"The DOM canvas (not \u003ccanvas>): pages, marquee, drag. Hit-testing delegates to services/hitTest.ts."},{"path":"components/canvas/CanvasElement.tsx","note":"Single element renderer — including THE DOMPurify.sanitize call, the one place foreign SVG ever reaches the DOM."},{"path":"components/HierarchyGeneratorModal.tsx","note":"Generator modal: two script editors, sandboxed Preview, atomic Apply, Saved Generator badge."},{"path":"components/LayersPanel.tsx","note":"Layers: hide/lock/color/rename/drag-reorder; hidden = excluded from canvas, PDF and thumbnails via one shared filter."},{"path":"components/cloud/CloudMenu.tsx","note":"Save/history/publish menu; the signed-out / no-username / ready 3-way branch; forked-from indicator."},{"path":"components/cloud/PublishModal.tsx","note":"Publish wizard. Compares rendered previews against picked pages and refuses partial sets."},{"path":"components/cloud/EditListingModal.tsx","note":"Edit a published listing without republishing. It holds the listing identity its save is refused without (published commit + published_at); shared/publicationTag.js turns that pair into the composite If-Match token cloudApi sends."},{"path":"components/gallery/ProjectCard.tsx","note":"The shared card with rollover previews — gallery grids, strips, and profile pages all render this one component (the ?view=all directory deliberately uses a compact table instead)."},{"path":"pages/EditorPage.tsx","note":"Route wrapper that anchors the pdf.js-heavy chunk (EditorPage → CloudMenu → PublishModal → thumbnailService)."},{"path":"pages/GalleryPage.tsx","note":"Three modes in one page: sections view, URL-param filtered grid, ?view=all sortable directory."},{"path":"pages/MergeRequestPage.tsx","note":"MR review: structured change list, conflict warnings, before/after preview; owner state comes from the server’s isTargetOwner."},{"path":"server/app.js","note":"createApp() factory. Middleware order is load-bearing: helmet → cors → host allow-list → auth (before express.json!) → origin check → rate limit → routes → SPA fallback."},{"path":"server/index.js","note":"Boot: run migrations, then listen. Production refuses to boot with OWNER_EMAILS empty."},{"path":"server/auth.js","note":"better-auth config. The hooks are the choke points: signup cap, password policy, admin-path denial (normalized-path bypass fix)."},{"path":"server/db.js","note":"query() working identically on Postgres and SQLite. Replaced a DROP TABLE CASCADE dev bootstrap — the first thing the gallery work fixed."},{"path":"server/migrations.js","note":"Run-once migration runner: advisory-locked, transactional, with a test that injects mid-migration failure and watches rollback."},{"path":"server/migrations/index.js","note":"All 16+ migrations inline, pg + sqlite variants. 012 installs the BEFORE INSERT trigger refusing sessions for suspended users; 013 creates no trigger — it replaces that trigger’s function so it reads the wall clock (Postgres only; the sqlite variant is a no-op)."},{"path":"server/routes/projects.js","note":"The big file: CRUD, commits, publish, publication PATCH, fork. The CAS save and published-commit pinning idioms live here."},{"path":"server/routes/gallery.js","note":"Public reads, reviews, tags, reports. The LIKE … ESCAPE wildcard fix is here."},{"path":"server/routes/mergeRequests.js","note":"MR lifecycle: live diff recompute per view, merge re-verified under the target-head lock."},{"path":"server/middleware/guards.js","note":"requireUsername guards exactly the six content-creating routes; requireAdmin/requireOwner check live config membership, never trusting a stored role."},{"path":"server/validateAppState.js","note":"Compatibility re-export preserving the server import path for the shared AppState validator."},{"path":"server/stateCodec.js","note":"gzip encode/decode for full-snapshot commits."},{"path":"server/projectLocks.js","note":"lockProjectRows — paired with db.js’s withTransaction, the write-path integrity layer every later round leans on."},{"path":"server/email.js","note":"Resend-or-console fail-safe email. A missing key never weakens sign-in blocking. First of the dotenv seals."},{"path":"server/signupCap.js","note":"Verified-only cap counting, fails open; SIGNUP_CAP trimmed first because Number(\" \") === 0 once meant “closed”."},{"path":"server/ownerAuthority.js","note":"OWNER_EMAILS reconciliation — the only root of trust for the owner role; no HTTP path grants it."},{"path":"server/platformAudit.js","note":"Append-only audit writes; an audit-insert failure rolls back the action it was recording."},{"path":"services/cloudApi.ts","note":"One typed wrapper for every server endpoint. New endpoint ⇒ new function here."},{"path":"services/migration.ts","note":"CURRENT_SCHEMA_VERSION and the v1→v11 chain. Presets and generator imports must stamp versions explicitly."},{"path":"services/textLayout.ts","note":"The renderer-independent text engine: segmentation, wrap, ellipsis, shrink — measurement injected."},{"path":"services/pdfService.ts","note":"jsPDF export: Unicode font embedding, link annotations from every branch, svg2pdf, grayscale."},{"path":"services/thumbnailService.ts","note":"jsPDF → pdfjs-dist → WebP preview pipeline (pdfjs pinned after npm latest shipped broken)."},{"path":"services/generatorSandbox.ts","note":"The generator trust boundary: sandboxed iframe, disposable worker, captured intrinsics, 10 s timeout."},{"path":"shared/diff.js","note":"The three-way diff/merge engine — under 200 lines, no dependencies, server-side today (the client renders the ChangeSet the server computed). This playground bundles the real thing (Merge Lab)."},{"path":"shared/generatorMetadata.js","note":"Generator provenance shape + size caps, shared by validator, diff, and client."},{"path":"shared/validateAppState.js","note":"Browser-safe implementation of the structural AppState gate: shape, 5 MB cap, node/element caps."},{"path":"deploy.sh","note":"Fail-closed deploy script — with its own unit tests, after review found it plowing on past failed builds."},{"path":"SCHEMA_CHANGELOG.md","note":"Schema history through v10 (v11 shipped without its entry — a documented, honest residual)."},{"path":"playwright.config.cjs","note":"e2e config; carries one of the dotenv seals (present-but-empty RESEND_API_KEY)."},{"path":"vite.config.ts","note":"Vite + vitest config: jsdom env, worktree/scratch excludes explained in comments."},{"path":"tests/helpers/gallerySampleHarness.ts","note":"Executes both generator scripts of every sample product exactly the way the modal does, then validates structure, links, bounds."}],"anchors":[{"id":"diff-changeset","file":"shared/diff.js","start":"export const computeChangeSet","end":"const touchedTemplates"},{"id":"diff-threeway","file":"shared/diff.js","start":"export const threeWayDiff","lines":30},{"id":"diff-apply","file":"shared/diff.js","start":"export const applyChangeSet","lines":28},{"id":"textlayout-engine","file":"services/textLayout.ts","start":"export function createTextLayoutEngine(","lines":30},{"id":"sandbox-parse","file":"services/generatorSandbox.ts","start":"const parseMessage = (message: unknown, requestToken: string)","lines":21},{"id":"migration-trigger","file":"server/migrations/index.js","start":"id: '012_session_suspension_guard',","lines":30},{"id":"publish-route","file":"server/routes/projects.js","start":"router.post('/api/projects/:id/publish'","lines":26},{"id":"validate-appstate","file":"shared/validateAppState.js","start":"export const validateAppState = (state)","lines":24},{"id":"email-seal","file":"server/email.js","start":"// Fail-safe: no RESEND_API_KEY","lines":14},{"id":"auth-hooks","file":"server/auth.js","start":"databaseHooks: {","lines":30},{"id":"spa-fallback","file":"server/app.js","start":"// Must pass a relative filename","lines":8}],"deepDives":[{"id":"diff-engine","title":"shared/diff.js — the whole merge system in under 200 lines","tagline":"Diffs whole templates, so schema rounds ride along for free.","sections":[{"text":"computeChangeSet answers “what changed between two states” at the granularity of variants and templates — never text lines. stableStringify (sorted keys) is the entire equality story: two objects are equal iff their canonical strings match. Note nodesChanged is a single boolean: the node hierarchy is compared wholesale.","anchorId":"diff-changeset"},{"text":"threeWayDiff computes both sides’ change sets against the common ancestor, then looks for genuine overlap. It detects exactly six conflict classes: the same template changed differently, a variant removed on one side and modified on the other, a variant added on both sides with different content, a variant renamed differently on both sides, the node hierarchy rewritten differently, and the generator — one atomic value, never line-merged. Changes that do not overlap coexist.","anchorId":"diff-threeway"},{"text":"applyChangeSet replays the fork’s changes on top of the CURRENT upstream state (not the ancestor) — preserving whatever upstream changed independently. The server re-runs conflict detection immediately before writing; the client only ever renders.","anchorId":"diff-apply"},{"text":"Because it diffs whole templates, the layers round (v8), overflow (v10) and padding (v11) all needed ZERO diff changes. Generator provenance (v9) is the one exception, and it proves the rule: the generator is not inside a template, so it had to earn its own equality rule, its own change kind and its own conflict case — about thirty lines. A schema mismatch between fork and upstream deliberately blocks the diff instead."}]},{"id":"text-layout","title":"services/textLayout.ts — one engine, two renderers","tagline":"Canvas and PDF cannot drift: they consume the same decisions.","sections":[{"text":"The engine owns segmentation, greedy wrap, ellipsis, shrink-to-fit and block sizing, with measurement injected as a function — so a canvas context and jsPDF metrics produce byte-identical layout decisions, and tests can inject fake metrics.","anchorId":"textlayout-engine"},{"text":"War stories encoded in its fix commits: the ellipsis search binary-searched grapheme counts, assuming width is monotonic in count (it isn’t guaranteed) — now a linear scan honoring the minimum-removal contract. Greedy wrap re-measured whole candidate lines per grapheme (O(n²)) — now single-pass with tests bounding measure-call counts."},{"text":"Grapheme safety comes from Intl.Segmenter with a bundled fallback (services/graphemes.ts); padding arrives pre-resolved (resolveTextContentBox shrinks the box before the engine sees it), so the engine never learns padding exists."}]},{"id":"generator-sandbox","title":"The generator sandbox — running strangers’ code","tagline":"Opening a project never executes anything. Previewing executes it in a cage.","sections":[{"text":"Since schema v9 a project can carry its generator source. That changed the trust model: the old Run button evaluated scripts with new Function in the app realm; Preview → Apply replaced it. Preview spawns a sandboxed iframe (no allow-same-origin, connect-src none) which spawns a disposable Worker, talks over a closure-private MessagePort, and dies on a 10-second timeout."},{"text":"parseMessage is the trust boundary on the way back: every message must carry the request token, and native intrinsics were captured before evaluated source ran — so a script can’t forge results or hide oversized output behind a patched byte-length getter.","anchorId":"sandbox-parse"},{"text":"The hardening commits read like an attack log: Worker/BroadcastChannel/postMessage fan-out denied inside the sandbox, a supervisor Worker so an infinite loop can’t outlive cancellation, reference-graph traversal bounded so malformed persisted input can’t hang rendering. Apply is one atomic state replace + one undo checkpoint."}]},{"id":"migrations","title":"Migrations — guarantees the database itself enforces","tagline":"Some invariants are too important to be code conventions.","sections":[{"text":"The runner applies each migration once, in order, under an advisory lock and a transaction — two servers booting at once can’t double-apply DDL, and a regression test injects a mid-migration failure and watches the half-applied statement roll back."},{"text":"012 is the interesting one: a BEFORE INSERT trigger on the session table refuses new sessions for actively-suspended users — closing a race no amount of session-deleting could. 013 fixed the fix: Postgres CURRENT_TIMESTAMP is frozen at transaction start, so an insert that waited on the suspension’s row lock evaluated stale pre-wait time; the trigger now reads the wall clock.","anchorId":"migration-trigger"},{"text":"The moderation audit table (011, 014) rejects UPDATE and DELETE by trigger — immutability as a database property — and records actor/target as values, not foreign keys, so deleting an account can’t erase its history."}]},{"id":"publication-pinning","title":"Publication pinning — public means what you published","tagline":"The gallery never tracks your private head.","sections":[{"text":"Publish validates, locks and writes in one transaction, and sets published_commit_id — the only commit public readers ever resolve. Ordinary saves and merges advance only the private head. This model came out of a whole-branch review that caught gallery readers being served the live head — promoted to “disclosure hazard” the day generator source became public.","anchorId":"publish-route"},{"text":"Listing metadata is pinned at publish too (name, description, tags — migration 010), so a private rename can’t silently rename a gallery card. The later PATCH /publication endpoint edits the listing without touching published_commit_id or published_at — the second omission is load-bearing: “Recently updated” sorts by published_at, and a tag fix must not be free promotion."},{"text":"The PATCH carries a composite If-Match token — published_commit_id AND percent-encoded published_at — because republishing an unchanged commit is legal, so a version-only token would wave through exactly the stale-dialog overwrite the token exists to stop."}]},{"id":"validate-appstate","title":"validateAppState — the one gate every stored AppState passes","tagline":"Create, commit, merge: three server call sites, one shared structural validator.","sections":[{"text":"The browser-safe implementation lives in shared/validateAppState.js; server/validateAppState.js is a compatibility re-export. Shape checks, a 5 MB cap, and node/element count caps are enforced before anything is stored. The server has exactly three call sites, one per path that accepts an AppState from a client: project create, commits, and the merge endpoint’s produced result (a merge that validates badly refuses rather than writing). Publish is deliberately NOT one of them: it takes listing fields and an If-Match head, never a state, and pins a commit that was already validated on the way in.","anchorId":"validate-appstate"},{"text":"It deliberately validates structure, not semantics: unknown extra fields ride along (that tolerance is what let layers/overflow/padding ship without server lockstep), while the client-side schema migration owns upgrading old documents."}]},{"id":"dotenv-seals","title":"The dotenv seals — deleting a variable is an invitation","tagline":"Sealed four times before it stayed sealed.","sections":[{"text":"The server loads dotenv at import time, and dotenv re-populates any MISSING variable from .env. So `delete process.env.RESEND_API_KEY` before tests doesn’t protect anything — the next import puts it back. Every guard is present-but-empty (`= ''`), which dotenv never overrides, with a regression test asserting the seal holds AFTER dotenv has loaded.","anchorId":"email-seal"},{"text":"The same trap was found and sealed in four places as real credentials arrived: the Playwright webServer config, the tutorial recording servers, the deploy script’s own .env loader (which also word-split quoted values and broke a production deploy), and the unit-test helpers — discovered when a routine full-suite run sent forty real verification emails to @test.dev addresses."}]},{"id":"auth-stack","title":"The auth stack — hooks as choke points","tagline":"Everything app-specific hangs off better-auth hooks, not forked library code.","sections":[{"text":"databaseHooks.user.create.before is the signup-cap choke point: both email signup and first-time Google OAuth pass through user creation, and returning OAuth users never do — the one place path-based middleware can’t be blind-sided. Its error message surfaces in the OAuth error callback (spaces underscored), which the login page decodes into the waitlist panel.","anchorId":"auth-hooks"},{"text":"hooks.before denies /admin/* INSIDE better-auth, where the path is already normalized — Express-level blocking was bypassed by percent-encoded dot-segments that normalized back to /admin/* inside the library. Red tests proved unban and role promotion answered 200 to a non-admin before the deny moved."},{"text":"Above admin sits a deployment-controlled owner: OWNER_EMAILS is the only root of trust, reconciled at startup and signup in one transaction; requireAdmin/requireOwner demand CURRENT config membership on every request — a stored role outliving its config entry grants nothing."}]}]},"playground":{"quizLevels":[{"title":"L1 · orientation","questions":[{"q":"What is PDF Architect, in one sentence?","options":["A cloud CMS for PDF forms","A PDF viewer with annotations","A local-first editor for structured PDF products (planners, journals) targeting e-ink pages","A print shop backend"],"answer":2,"why":"Local-first is the founding constraint — everything (editing, export) works with no account; cloud/gallery is opt-in on top. See the INTRO window."},{"q":"Where does an anonymous user’s project live?","options":["Legacy Web Storage (read-only migration source)","IndexedDB","A cloud draft keyed by cookie","The URL fragment"],"answer":1,"why":"Projects persist in IndexedDB; legacy browser storage is read only during migration, and cloud storage starts after an explicit “save to cloud”."},{"q":"npm run dev starts…","options":["Vite only","Vite and the Express API concurrently","A Docker compose stack","Express serving a prebuilt dist/"],"answer":1,"why":"package.json: concurrently \"vite\" \"node server/index.js\" — client :3000, API :3001."},{"q":"Databases in dev and prod are…","options":["Postgres everywhere","SQLite everywhere","MongoDB","SQLite dev, Postgres prod — one query() over both"],"answer":3,"why":"server/db.js exposes one query() over both engines and migrations carry pg and sqlite variants; the ~20 places the engines genuinely differ (FOR UPDATE, advisory locks) branch on dbType explicitly."},{"q":"A “variant” is…","options":["An alternate template set over the same node hierarchy","A git branch of the project","A color theme","A fork on the gallery"],"answer":0,"why":"One document, many looks: variants swap the templates; the hierarchy stays shared. types.ts is the reference."},{"q":"The in-app /docs content comes from…","options":["A CMS","Hand-written JSX pages","Bundled markdown in docs-content/, validated at load","The GitHub wiki"],"answer":2,"why":"docs-content/ markdown is parsed and validated in the unit suite — a broken link or duplicate slug fails the build."},{"q":"How does a project become publicly visible?","options":["Auto-sync once signed in","Sharing a link","Admin approval","An explicit publish that pins a specific commit"],"answer":3,"why":"Publishing pins published_commit_id; private saves never move public content. The “pinned snapshot” tour walks it."},{"q":"What lives in shared/?","options":["CSS shared by pages","Plain ESM imported by BOTH client and server — generator metadata and shared validation rules","React context providers","Test fixtures"],"answer":1,"why":"shared/generatorMetadata.js is imported by services/generatorSandbox.ts and the browser-safe shared/validateAppState.js implementation; server/validateAppState.js is its compatibility re-export. shared/passwordPolicy.js is imported by pages/LoginPage.tsx AND server/auth.js. shared/diff.js is server-side today — the client renders the ChangeSet the server computed."}]},{"title":"L2 · the client","questions":[{"q":"The editor canvas is technically…","options":["A \u003ccanvas> 2D context","SVG","WebGL","Absolutely-positioned DOM elements"],"answer":3,"why":"DOM canvas — which is why thumbnails need the jsPDF→pdfjs pipeline and why editor chrome needed isolation:isolate."},{"q":"Current document schema version, defined where?","options":["v7 in types.ts","v11 in services/migration.ts","v11 in server/validateAppState.js","v9 in shared/diff.js"],"answer":1,"why":"CURRENT_SCHEMA_VERSION = 11 in services/migration.ts; the server validator deliberately doesn’t own versioning."},{"q":"How are layers stored (“Shape B”)?","options":["A flat element array + layerId tags + layers metadata on the template","Elements nested inside layer objects","A separate layers table in the cloud","CSS z-index only"],"answer":0,"why":"Flat elements stay individually addressable, render/export only re-sort, and the diff engine needed zero changes."},{"q":"Why do elements render inside an isolation:isolate wrapper?","options":["Performance","Accessibility","So user-set z-index can never paint over selection chrome at z-100","Print fidelity"],"answer":2,"why":"A template with an element at z>100 covered the selection border — isolation gives elements their own stacking context."},{"q":"The gallery-project-as-modal trick uses…","options":["A portal + display:none page","React Router background locations — URL changes, page underneath keeps rendering","An iframe","Query params only"],"answer":1,"why":"Direct loads/refreshes render the standalone page; in-app clicks pass the current location as state. Spiked before planning."},{"q":"Components call the server through…","options":["fetch() inline","A GraphQL client","React Query hooks per component","services/cloudApi.ts, one typed wrapper per cloud endpoint"],"answer":3,"why":"One file to grep when an endpoint changes — ~40 typed wrappers. Two raw-fetch holdouts remain: services/analytics.ts and the public profile load in pages/ProfilePage.tsx."},{"q":"Opening someone’s project that carries generator scripts…","options":["Runs them to rebuild the document","Strips them","Never executes them — only an explicit Preview runs, sandboxed","Asks for permission then runs in-page"],"answer":2,"why":"Opening must never execute foreign code. Preview runs in a sandboxed iframe + disposable worker with a 10 s timeout (SANDBOX_TIMEOUT_MS, services/generatorSandbox.ts)."},{"q":"Which client code is code-split off the main chunk?","options":["The /docs section and the Edit Listing modal","Every route","The gallery","Nothing"],"answer":0,"why":"App.tsx imports every page statically by design — there are no per-route chunks. DocsSection and the ~6 kB EditListingModal are the client’s only two lazy boundaries. Splitting the docs section out moved roughly 160 KB gzipped off the critical path, measured on a production build."}]},{"title":"L3 · server & data","questions":[{"q":"Migration policy is…","options":["Edit the schema file and restart","Versioned, run-once, append-only — never edit an applied migration","ORM auto-migration","Manual SQL in prod"],"answer":1,"why":"server/migrations/index.js is a ledger; the runner is transactional and takes a Postgres advisory lock so two boots cannot race. It replaced a bootstrap that DROP TABLEd the auth tables on every start."},{"q":"A cloud commit stores…","options":["A gzip’d full snapshot of AppState","A diff against the parent","Only changed templates","A patch file"],"answer":0,"why":"Full snapshots (decided pre-code) make history, restore, fork and merge simple reads. stateCodec.js does the gzip."},{"q":"What does publishing pin, exactly?","options":["The head commit forever","A tag name","published_commit_id + listing metadata (name/description/tags) at publish time","A rendered PDF"],"answer":2,"why":"Migrations 009/010: public readers resolve only the pinned commit and pinned metadata; saves move the private head only."},{"q":"A merge request’s diff is…","options":["Snapshotted when opened","Cached for an hour","Recomputed live on every view","Computed client-side only"],"answer":2,"why":"A request that becomes conflicted after upstream changes is caught on view — and the merge endpoint re-verifies under lock anyway."},{"q":"requireUsername guards…","options":["Every /api route","The six content-creating routes (create/commits/publish/fork/MR/reviews) — not unpublish/delete/close","Only publish","Only the gallery"],"answer":1,"why":"Every write that attaches a public handle is gated; cleanup routes aren’t, so legacy no-username accounts can still reduce their own exposure."},{"q":"Star-rating averages are…","options":["Denormalized onto projects and updated on write","Computed client-side","Cached in Redis","Computed at read time with SQL AVG()"],"answer":3,"why":"A live AVG can’t drift the way a hand-maintained counter can — ratings change on every edit and delete."},{"q":"Forking a public project gives you…","options":["A private project copied from the PUBLISHED commit, with lineage recorded","A public linked copy","A branch on the original","Read access"],"answer":0,"why":"A fork starts private and copies the source’s PUBLISHED commit — not the owner’s private head, even when you fork your own project. Lineage lands in forked_from_project_id/_commit_id, which the gallery renders as attribution."},{"q":"A save with a stale If-Match tag gets…","options":["A silent overwrite","A merge attempt","A retry loop server-side","A stable 409 and no orphan commit"],"answer":3,"why":"Heads advance by transactional compare-and-swap; the losing writer is told cleanly and nothing half-lands."}]},{"title":"L4 · security & integrity","questions":[{"q":"The stored-XSS fix for SVG artwork was…","options":["A CSP header","Escaping on upload","DOMPurify at the single place SVG is ever rendered","Blocking SVG in the gallery"],"answer":2,"why":"components/canvas/CanvasElement.tsx sanitizes with the svg/svgFilters profile — verified with a live exploit before and after."},{"q":"The signup cap is enforced in…","options":["Express middleware on /sign-up","better-auth databaseHooks.user.create.before","The client form","nginx"],"answer":1,"why":"The one choke point email signup AND first-time OAuth share; returning OAuth users never create a row so never hit it."},{"q":"Why did the Express-level /api/auth/admin block get bypassed?","options":["A missing await","CORS misconfig","A regex typo","Percent-encoded dot-segments normalized back to /admin/* inside better-auth"],"answer":3,"why":"The real deny now lives in better-auth’s hooks.before, which sees the normalized path; the Express 404 stays as defense in depth. Red tests proved the bypass first."},{"q":"A suspended user trying to establish a NEW session is stopped by…","options":["Session-delete sweeps","A BEFORE INSERT trigger on the session table","The client","Rate limiting"],"answer":1,"why":"Migration 012 makes it a database property — closing the race that session deletion alone can’t."},{"q":"The moderation audit log is immutable because…","options":["UPDATE/DELETE-rejecting triggers on the table itself","Code convention","It’s append-only S3","Row-level security"],"answer":0,"why":"Triggers on both engines; actor/target stored as values (not FKs) so deleting an account can’t erase history."},{"q":"The owner role is granted by…","options":["An admin promoting you","A signup flag","The first account ever created","OWNER_EMAILS config reconciliation at startup/signup — no HTTP path exists"],"answer":3,"why":"Stale stored owners drop to plain user; requireOwner checks live config membership on every request."},{"q":"Uploaded preview thumbnails are validated by…","options":["File extension","Claimed MIME type","Actual magic bytes + a 300 KB cap","Virus scan"],"answer":2,"why":"parseThumbnail reads the bytes; a renamed .html can’t masquerade as a .webp."},{"q":"When do someone else’s generator scripts execute in your browser?","options":["Only when YOU click Preview — inside the sandbox","On project open","On gallery hover","On fork"],"answer":0,"why":"Open never executes; Apply applies the previewed result; the sandbox denies network, same-origin, and worker fan-out."}]},{"title":"L5 · war stories","questions":[{"q":"Why didn’t `delete process.env.RESEND_API_KEY` protect tests from sending real email?","options":["Tests ran in a subprocess","dotenv re-populates any MISSING variable from .env on import","The key was cached","Resend ignores env"],"answer":1,"why":"Deleting a variable is an invitation. Every guard is present-but-empty, asserted AFTER dotenv loads. Sealed four times."},{"q":"Pre-fix, DISABLE_AUTH_RATE_LIMIT=false did what?","options":["Nothing","Enabled stricter limits","Disabled brute-force protection — any value was truthy","Crashed boot"],"answer":2,"why":"enabled: !process.env.X treats \"false\" as disable. The fix is a strict !== \"true\" check."},{"q":"The tag filter’s “exact match” leaked because…","options":["Unescaped % and _ in the LIKE pattern matched across JSON boundaries","Case sensitivity","Unicode","A join bug"],"answer":0,"why":"Fixed with an ESCAPE clause behaving identically on Postgres and SQLite, plus a regression test."},{"q":"The Change Password section had never rendered for anyone because…","options":["A CSS bug","A feature flag","It required owner role","The code checked a.provider but better-auth returns providerId — and the unit-test mock encoded the same wrong guess"],"answer":3,"why":"The mandatory real-browser task caught what mocked units structurally couldn’t. pages/AccountSettingsPage.tsx."},{"q":"Why does insertCommit stamp created_at itself instead of taking the database default?","options":["UUIDv4 sort","A race in Express","SQLite CURRENT_TIMESTAMP has whole-second resolution and ORDER BY then falls through to a random UUID id","Clock skew"],"answer":2,"why":"Two commits in the same second would tie on created_at and order randomly. Caught inside the task that added the API, so it never shipped broken — server/routes/projects.js."},{"q":"SIGNUP_CAP=\" \" (a stray space) originally meant…","options":["Unset","Signups CLOSED — Number(\" \") === 0","Default 500","Crash"],"answer":1,"why":"Trimmed first now; whitespace means unset. Same review also caught deploy --set-env-vars replacing the whole env set."},{"q":"The page-dimension unit dropdown (pt/px/in/mm) spent six months, up to the layers follow-up, being…","options":["Rounding wrong","Metric-only","Breaking undo","Purely decorative — the conversion table was imported but never called"],"answer":3,"why":"A multi-select refactor dropped the conversion calls, so inputs showed raw points whatever the dropdown claimed. Switching units now re-expresses size, with round-trip drift tests."},{"q":"Profile pages shipped a release with zero thumbnails because…","options":["Endpoint omitted the new field + card dropped its fallback + a defensive default hid the crash — and no task owned the visual outcome","A CDN outage","An auth bug","Image caps"],"answer":0,"why":"Task 1 flagged it, Task 4 guarded it, nobody owned it. The fix added the field at the source plus a profile-page test."}]}],"bugHunt":[{"id":"dotenv-resurrection","title":"The test suite that emailed forty strangers","setup":"Unit-test helper, written to guarantee tests can never send real email:","code":"export const initTestApp = async () => {\n    process.env.SQLITE_PATH = scratchDbPath();\n\n    // Ensure the suite can never deliver real email.\n    delete process.env.RESEND_API_KEY;\n\n    // server/auth.js loads dotenv during this dynamic import.\n    const { createApp } = await import('../../../server/app.js');\n    return createApp();\n};","guiltyLine":4,"story":"The server loads dotenv during import — and dotenv re-populates any MISSING variable from .env. Deleting a variable is an invitation: the next import put the real key straight back, and a routine full-suite run sent forty real verification emails to @test.dev addresses. The seal is now present-but-empty (assigned the empty string), which dotenv never overrides, with a regression test asserting the seal holds AFTER dotenv has loaded — tests/unit/server/emailSealing.test.js. The same trap was sealed in four places: Playwright config, tutorial recording servers, deploy script, unit-test helpers.","fixedRef":"tests/unit/server/helpers.js"},{"id":"rate-limit-toggle","title":"The off switch that only had one position","setup":"better-auth rate limiting, with a way to opt out under test:","code":"rateLimit: {\n    // Tests create four users in a beforeAll and trip the built-in 3-per-10s sign-up rule.\n    enabled: !process.env.DISABLE_AUTH_RATE_LIMIT,\n    window: 60,\n    max: 20\n},","guiltyLine":2,"story":"Any value — including the DISABLE_AUTH_RATE_LIMIT=false someone writes to mean “do NOT disable this” — is a truthy string, so the negation turned brute-force protection OFF on any misconfigured deploy. The flag was added mid-round to unblock a flaky test, and the ratings round’s whole-branch review caught what no per-task review structurally could. The fix compares against the exact string “true”, so every other value — including “false” and the empty string — leaves the limiter on. It fails safe now.","fixedRef":"server/auth.js"},{"id":"like-wildcards","title":"The exact match that wasn’t","setup":"The gallery’s exact-tag filter, matching a JSON-quoted tag inside a stored tags string:","code":"if (tag) {\n    // JSON-quoting the tag makes this an exact element match: plan cannot match planner.\n    params.push(`%${JSON.stringify(tag)}%`);\n    where += ` AND p.tags LIKE $${params.length}`;\n}","guiltyLine":2,"story":"JSON.stringify makes it look airtight — the closing quote is exactly why plan cannot match planner. But it escapes JSON metacharacters, not LIKE ones: a tag containing % or _ carried live wildcards into the pattern and matched unrelated projects across JSON element boundaries, leaking the exact-match guarantee the comment above it promised. Caught by the same whole-branch review as the rate-limit toggle, and fixed by escaping backslash first, then % and _, plus an ESCAPE clause that behaves identically on Postgres and SQLite — with regression tests in galleryFilters.test.js. The column reads published_tags today; publishing pinned its own metadata later.","fixedRef":"server/routes/gallery.js"},{"id":"provider-id","title":"The section nobody ever saw","setup":"Account settings — show Change Password only for accounts that have a password credential:","code":"const res = await authClient.listAccounts();\n// Only credential accounts can change a password.\nsetHasCredential(!!res?.data?.some(a => a.provider === 'credential'));","guiltyLine":2,"story":"better-auth’s list-accounts returns providerId, not provider — so the predicate was false for everyone and the section had never rendered for a single user. The unit-test mock had encoded the same wrong field name, so the unit suite was green the whole time. The mandatory real-browser verification task is what caught it; the fix corrected the check and the mock together, and the mock now carries a comment pointing at the better-auth source that defines the real wire shape.","fixedRef":"pages/AccountSettingsPage.tsx"},{"id":"commit-timestamps","title":"Newest first, by coin flip","setup":"The commits table and its history query:","code":"CREATE TABLE commits (\n    id TEXT PRIMARY KEY,\n    project_id TEXT NOT NULL,\n    state BLOB NOT NULL,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n-- newest first\nSELECT * FROM commits WHERE project_id = ? ORDER BY created_at DESC, id DESC;","guiltyLine":4,"story":"SQLite’s CURRENT_TIMESTAMP has whole-second resolution. Two commits saved within the same second tie — and the tiebreak column is a random UUID, so “newest commit first” would have become a coin flip exactly when someone saved twice quickly. This is the one that never shipped broken: the commit that first built the cloud history API already stamped created_at from the app at millisecond precision, with the reasoning spelled out in a comment, in the same commit that wrote the ORDER BY it protects. The table still declares DEFAULT CURRENT_TIMESTAMP — insertCommit simply never lets it fire.","fixedRef":"server/routes/projects.js"},{"id":"signup-cap-space","title":"The stray space that closed signups","setup":"Reading the signup cap from the environment — blank must mean “unset”, because 0 means signups are CLOSED:","code":"const raw = process.env.SIGNUP_CAP;\nif (raw === undefined || raw === '') return DEFAULT_CAP;\nconst parsed = Number(raw);\nif (!Number.isInteger(parsed) || parsed \u003c 0) return DEFAULT_CAP;\nreturn parsed;","guiltyLine":1,"story":"SIGNUP_CAP=' ' — one stray space in a deploy config — sails past the empty-string check, and Number(' ') === 0 is an integer that is not negative. Zero means CLOSED, so a whitespace typo would have silently shut the front door. The value is now trimmed first, and whitespace means unset. The same review caught deploy.sh’s --set-env-vars replacing the entire env set, so one update line omitting SIGNUP_CAP would have wiped it; a test now asserts every update line carries it.","fixedRef":"server/signupCap.js"},{"id":"spa-fallback","title":"Every deep link 404s in the production build","setup":"The SPA fallback route, serving the client for any non-API path:","code":"const distPath = path.join(__dirname, '../dist');\napp.use(express.static(distPath));\napp.get(/.*/, (req, res) => {\n    res.sendFile(path.join(distPath, 'index.html'));\n});","guiltyLine":3,"story":"express@5.2.1’s res.sendFile() 404s on a bare absolute path here even when the file exists — so every hard load of any non-root route (/login, /app, every gallery URL, a refresh, a bookmark) died the moment the app was served from the built dist/ instead of the dev server. In-app navigation was unaffected and Vite’s dev server has its own correct fallback, which is why the identical call sat unnoticed for six months, byte-for-byte, since the repo’s first Express commit. What found it was the gallery plan’s final task building and booting the production path for the first time — not a code review. The fix is the one-line recommended form: res.sendFile('index.html', { root: distPath }).","anchorId":"spa-fallback","fixedRef":"server/app.js"}],"mergeScenarios":[{"name":"clean-merge","blurb":"Fork edits the day template; upstream renames the variant. No overlap — applyChangeSet keeps both.","base":{"nodes":{"root":{"id":"root","name":"Planner","children":["week"]},"week":{"id":"week","name":"Week 1","children":[]}},"rootId":"root","variants":{"weekly":{"name":"Weekly","templates":{"day":{"id":"day","elements":[{"type":"text","text":"Day","x":10,"y":10}]},"notes":{"id":"notes","elements":[{"type":"rect","x":0,"y":0,"w":100,"h":40}]}}}}},"fork":{"nodes":{"root":{"id":"root","name":"Planner","children":["week"]},"week":{"id":"week","name":"Week 1","children":[]}},"rootId":"root","variants":{"weekly":{"name":"Weekly","templates":{"day":{"id":"day","elements":[{"type":"text","text":"Day (fork)","x":10,"y":10}]},"notes":{"id":"notes","elements":[{"type":"rect","x":0,"y":0,"w":100,"h":40}]}}}}},"upstream":{"nodes":{"root":{"id":"root","name":"Planner","children":["week"]},"week":{"id":"week","name":"Week 1","children":[]}},"rootId":"root","variants":{"weekly":{"name":"Weekly v2","templates":{"day":{"id":"day","elements":[{"type":"text","text":"Day","x":10,"y":10}]},"notes":{"id":"notes","elements":[{"type":"rect","x":0,"y":0,"w":100,"h":40}]}}}}}},{"name":"same-template-conflict","blurb":"Both sides edit the same template differently. The engine refuses; a human decides.","base":{"nodes":{"root":{"id":"roo
