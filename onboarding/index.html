<script>window.DoctectDiff = (() => {
const GENERATOR_FORMAT_VERSION = 1;
const GENERATOR_SCRIPT_MAX_BYTES = 512 * 1024;
const GENERATOR_COMBINED_MAX_BYTES = 1024 * 1024;
const GENERATOR_KEYS = ['formatVersion', 'templateScript', 'hierarchyScript', 'generatedAt'];

const byteLength = value => new TextEncoder().encode(value).byteLength;
const isPlainObject = value => value !== null && typeof value === 'object'
  && !Array.isArray(value) && Object.getPrototypeOf(value) === Object.prototype;

const validateGeneratorProvenance = (value, { strictUnknownFields = false } = {}) => {
  if (!isPlainObject(value)) return { ok: false, issue: 'not_plain_object', message: 'Saved generator must be an object.' };
  if (strictUnknownFields && Object.keys(value).some(key => !GENERATOR_KEYS.includes(key))) {
    return { ok: false, issue: 'unknown_field', message: 'Saved generator contains unknown fields.' };
  }
  if (value.formatVersion !== GENERATOR_FORMAT_VERSION) return { ok: false, issue: 'format_version', message: 'Unsupported generator format version.' };
  if (typeof value.templateScript !== 'string') return { ok: false, issue: 'template_script', message: 'Template script must be text.' };
  if (typeof value.hierarchyScript !== 'string') return { ok: false, issue: 'hierarchy_script', message: 'Hierarchy script must be text.' };
  const templateBytes = byteLength(value.templateScript);
  const hierarchyBytes = byteLength(value.hierarchyScript);
  if (templateBytes > GENERATOR_SCRIPT_MAX_BYTES) return { ok: false, issue: 'template_script_too_large', message: 'Template script exceeds 512 KiB.' };
  if (hierarchyBytes > GENERATOR_SCRIPT_MAX_BYTES) return { ok: false, issue: 'hierarchy_script_too_large', message: 'Hierarchy script exceeds 512 KiB.' };
  if (templateBytes + hierarchyBytes > GENERATOR_COMBINED_MAX_BYTES) return { ok: false, issue: 'combined_scripts_too_large', message: 'Combined generator source exceeds 1 MiB.' };
  const generatedDate = typeof value.generatedAt === 'string' ? new Date(value.generatedAt) : null;
  if (!generatedDate || Number.isNaN(generatedDate.getTime()) || generatedDate.toISOString() !== value.generatedAt) {
    return { ok: false, issue: 'generated_at', message: 'Generator timestamp must be ISO 8601 text.' };
  }
  return { ok: true, value: {
    formatVersion: GENERATOR_FORMAT_VERSION,
    templateScript: value.templateScript,
    hierarchyScript: value.hierarchyScript,
    generatedAt: value.generatedAt,
  } };
};

const normalizeGeneratorProvenance = value => {
  if (value === undefined) return {};
  const result = validateGeneratorProvenance(value);
  return result.ok ? { generator: result.value } : { warning: `Saved generator was detached: ${result.message}` };
};

const generatorProvenanceEqual = (left, right) =>
  left === undefined && right === undefined
  || Boolean(left && right
    && left.formatVersion === right.formatVersion
    && left.templateScript === right.templateScript
    && left.hierarchyScript === right.hierarchyScript
    && left.generatedAt === right.generatedAt);

// Structured three-way diff/merge for PDF Architect project states.
// Plain ESM JavaScript so both the Express server and the Vite client can import it.
// A "DiffState" is any object with { nodes, rootId, variants } (extra fields ignored).



/**
 * @typedef {Object} ChangeSet
 * @property {string[]} variantsAdded
 * @property {string[]} variantsRemoved
 * @property {Record<string,string>} variantsRenamed   // variantId -> new name
 * @property {Record<string,string[]>} templatesAdded  // variantId -> templateIds
 * @property {Record<string,string[]>} templatesModified
 * @property {Record<string,string[]>} templatesRemoved
 * @property {boolean} nodesChanged
 * @property {null|'added'|'modified'|'removed'} generatorChange
 */

const stableStringify = (value) => {
    if (value === null || typeof value !== 'object') return JSON.stringify(value);
    if (Array.isArray(value)) return '[' + value.map(stableStringify).join(',') + ']';
    return '{' + Object.keys(value).sort()
        .map(k => JSON.stringify(k) + ':' + stableStringify(value[k]))
        .join(',') + '}';
};

const eq = (a, b) => stableStringify(a) === stableStringify(b);
const clone = (v) => JSON.parse(JSON.stringify(v));
const pushMap = (map, key, val) => { (map[key] = map[key] || []).push(val); };
const generatorValue = state => state.generator ?? null;
const generatorEqual = (left, right) => left === null || right === null
    ? left === right
    : generatorProvenanceEqual(left, right);

/** @returns {ChangeSet} */
const computeChangeSet = (base, side) => {
    const cs = {
        variantsAdded: [], variantsRemoved: [], variantsRenamed: {},
        templatesAdded: {}, templatesModified: {}, templatesRemoved: {},
        nodesChanged: false,
        generatorChange: null
    };
    cs.nodesChanged = !eq(
        { nodes: base.nodes, rootId: base.rootId },
        { nodes: side.nodes, rootId: side.rootId }
    );
    const baseGenerator = generatorValue(base);
    const sideGenerator = generatorValue(side);
    if (!generatorEqual(baseGenerator, sideGenerator)) {
        cs.generatorChange = baseGenerator === null ? 'added'
            : sideGenerator === null ? 'removed'
                : 'modified';
    }
    const baseV = base.variants || {};
    const sideV = side.variants || {};
    for (const vid of Object.keys(sideV)) if (!baseV[vid]) cs.variantsAdded.push(vid);
    for (const vid of Object.keys(baseV)) if (!sideV[vid]) cs.variantsRemoved.push(vid);
    for (const vid of Object.keys(sideV)) {
        if (!baseV[vid]) continue; // wholly-added variants aren't itemized
        if (baseV[vid].name !== sideV[vid].name) cs.variantsRenamed[vid] = sideV[vid].name;
        const bt = baseV[vid].templates || {};
        const st = sideV[vid].templates || {};
        for (const tid of Object.keys(st)) {
            if (!bt[tid]) pushMap(cs.templatesAdded, vid, tid);
            else if (!eq(bt[tid], st[tid])) pushMap(cs.templatesModified, vid, tid);
        }
        for (const tid of Object.keys(bt)) {
            if (!st[tid]) pushMap(cs.templatesRemoved, vid, tid);
        }
    }
    return cs;
};

const touchedTemplates = (cs, vid) => new Set([
    ...(cs.templatesAdded[vid] || []),
    ...(cs.templatesModified[vid] || []),
    ...(cs.templatesRemoved[vid] || [])
]);

const variantTouched = (cs, vid) =>
    touchedTemplates(cs, vid).size > 0 || Object.prototype.hasOwnProperty.call(cs.variantsRenamed, vid);

/**
 * @typedef {Object} Conflict
 * @property {'nodes'|'variant'|'template'|'generator'} kind
 * @property {string} [id]
 * @property {string} [variantId]
 * @property {string} [templateId]
 * @property {string} description
 */

/** @returns {{source: ChangeSet, target: ChangeSet, conflicts: Conflict[]}} */
const threeWayDiff = (base, source, target) => {
    const src = computeChangeSet(base, source);
    const tgt = computeChangeSet(base, target);
    const conflicts = [];

    if (src.nodesChanged && tgt.nodesChanged &&
        !eq({ nodes: source.nodes, rootId: source.rootId }, { nodes: target.nodes, rootId: target.rootId })) {
        conflicts.push({ kind: 'nodes', description: 'Both projects changed the page hierarchy differently' });
    }

    if (src.generatorChange !== null && tgt.generatorChange !== null
        && !generatorEqual(generatorValue(source), generatorValue(target))) {
        conflicts.push({
            kind: 'generator',
            id: 'generator',
            description: 'Generator source changed differently on both branches.',
        });
    }

    for (const vid of src.variantsAdded) {
        if (tgt.variantsAdded.includes(vid) && !eq(source.variants[vid], target.variants[vid])) {
            conflicts.push({ kind: 'variant', variantId: vid, description: `Variant "${vid}" was added on both sides with different content` });
        }
    }
    for (const vid of Object.keys(src.variantsRenamed)) {
        if (vid in tgt.variantsRenamed && src.variantsRenamed[vid] !== tgt.variantsRenamed[vid]) {
            conflicts.push({ kind: 'variant', variantId: vid, description: `Variant "${vid}" was renamed differently on both sides` });
        }
    }
    for (const vid of src.variantsRemoved) {
        if (variantTouched(tgt, vid)) {
            conflicts.push({ kind: 'variant', variantId: vid, description: `Variant "${vid}" was removed in the fork but modified upstream` });
        }
    }
    for (const vid of tgt.variantsRemoved) {
        if (variantTouched(src, vid)) {
            conflicts.push({ kind: 'variant', variantId: vid, description: `Variant "${vid}" was removed upstream but modified in the fork` });
        }
    }

    const vids = new Set([
        ...Object.keys(src.templatesAdded), ...Object.keys(src.templatesModified), ...Object.keys(src.templatesRemoved),
        ...Object.keys(tgt.templatesAdded), ...Object.keys(tgt.templatesModified), ...Object.keys(tgt.templatesRemoved)
    ]);
    for (const vid of vids) {
        const srcSet = touchedTemplates(src, vid);
        const tgtSet = touchedTemplates(tgt, vid);
        for (const tid of srcSet) {
            if (!tgtSet.has(tid)) continue;
            const sVal = source.variants[vid]?.templates?.[tid];
            const tVal = target.variants[vid]?.templates?.[tid];
            if (!eq(sVal, tVal)) {
                conflicts.push({ kind: 'template', variantId: vid, templateId: tid, description: `Template "${tid}" in variant "${vid}" was changed on both sides` });
            }
        }
    }

    return { source: src, target: tgt, conflicts };
};

/**
 * Applies source's changes (relative to base) on top of target.
 * PRECONDITION: threeWayDiff(base, source, target).conflicts is empty.
 * @returns merged full state (target clone + source changes)
 */
const applyChangeSet = (base, source, target) => {
    const merged = clone(target);
    const cs = computeChangeSet(base, source);

    if (cs.nodesChanged) {
        merged.nodes = clone(source.nodes);
        merged.rootId = source.rootId;
    }
    if (cs.generatorChange === 'removed') delete merged.generator;
    if (cs.generatorChange === 'added' || cs.generatorChange === 'modified') {
        merged.generator = clone(source.generator);
    }
    for (const vid of cs.variantsAdded) merged.variants[vid] = clone(source.variants[vid]);
    for (const vid of cs.variantsRemoved) delete merged.variants[vid];
    for (const [vid, newName] of Object.entries(cs.variantsRenamed)) {
        if (merged.variants[vid]) merged.variants[vid].name = newName;
    }
    const applyTemplates = (map, fn) => {
        for (const [vid, tids] of Object.entries(map)) {
            if (!merged.variants[vid]) continue;
            for (const tid of tids) fn(vid, tid);
        }
    };
    applyTemplates(cs.templatesAdded, (vid, tid) => { merged.variants[vid].templates[tid] = clone(source.variants[vid].templates[tid]); });
    applyTemplates(cs.templatesModified, (vid, tid) => { merged.variants[vid].templates[tid] = clone(source.variants[vid].templates[tid]); });
    applyTemplates(cs.templatesRemoved, (vid, tid) => { delete merged.variants[vid].templates[tid]; });

    if (!merged.variants[merged.activeVariantId]) {
        merged.activeVariantId = Object.keys(merged.variants)[0];
    }
    return merged;
};

// Pure helpers for the onboarding playground. No DOM access here — everything

const WINDOWS = [
    { id: 'intro', label: 'intro' },
    { id: 'tours', label: 'tours' },
    { id: 'code', label: 'code' },
    { id: 'playground', label: 'playground' },
];

const parseHash = (hash) => {
    const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    const win = WINDOWS.some(w => w.id === parts[0]) ? parts[0] : 'intro';
    return { win, parts: win === parts[0] ? parts.slice(1) : [] };
};

const buildHash = (win, parts = []) => '#/' + [win, ...parts].join('/');

const formatBytes = (n) => n < 1024 ? `${n} B`
    : n < 1024 * 1024 ? `${(n / 1024).toFixed(1)} KB`
    : `${(n / (1024 * 1024)).toFixed(1)} MB`;

const escapeHtml = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const filterTree = (node, query) => {
    const q = (query || '').toLowerCase();
    if (!q) return node;
    if (node.kind === 'file') {
        return node.path.toLowerCase().includes(q) ? node : null;
    }
    const children = (node.children || []).map(c => filterTree(c, q)).filter(Boolean);
    if (children.length === 0 && !node.path.toLowerCase().includes(q)) return null;
    return { ...node, children: children.length ? children : node.children };
};

const findNode = (tree, path) => {
    if (tree.path === path) return tree;
    for (const c of tree.children || []) {
        if (path === c.path || path.startsWith(c.path + '/')) return findNode(c, path);
    }
    return null;
};

const flattenDirs = (tree, out = []) => {
    if (tree.kind === 'dir') { out.push(tree.path); (tree.children || []).forEach(c => flattenDirs(c, out)); }
    return out;
};

const nearestAnnotated = (path, annotations) => {
    let probe = path;
    while (probe) {
        const hit = annotations.find(a => a.path === probe);
        if (hit) return hit;
        probe = probe.includes('/') ? probe.slice(0, probe.lastIndexOf('/')) : '';

};

const RANKS = [
    ['visitor', 0], ['intern', 0.2], ['contributor', 0.45], ['reviewer', 0.7], ['maintainer', 0.9],
];

const rankFor = (points, max) => {
    const frac = max > 0 ? points / max : 0;
    let rank = RANKS[0][0];
    for (const [name, floor] of RANKS) if (frac >= floor) rank = name;
    return rank;
};

const scoreProfile = (profile, playground) => {
    let points = 0, max = 0;
    playground.quizLevels.forEach((level, i) => {
        max += level.questions.length;
        points += profile.quiz[i]?.best || 0;
    });
    max += playground.bugHunt.length;
    points += playground.bugHunt.filter(b => profile.bugs[b.id] === 'found').length;
    max += playground.wdil.length;
    points += playground.wdil.filter(w => profile.wdil[w.id]?.done && !profile.wdil[w.id]?.failed).length;
    return { points, max };
};

const levelUnlocked = (profile, levelIndex) =>
    levelIndex === 0 || (profile.quiz[levelIndex - 1]?.best || 0) >= 6;

function highlightCode(code) {

    return esc
        .replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)/g, '<span class="tok-c">$1</span>')
        .replace(/(&#39;|')(?:[^'\\\n]|\\.)*\1|(&quot;|")(?:[^"\\\n]|\\.)*\2|`[^`]*`/g,
            (m) => m.includes('tok-') ? m : `<span class="tok-s">${m}</span>`)

        .replace(/<\/?span[^>]*>|\b(const|let|var|function|return|if|else|for|while|import|export|class|new|throw|await|async|null|true|false|typeof|delete)\b/g,

}

function treeHtml(node, selectedPath, openPaths) {

function renderQuiz(el, ctx, levelIdx) {
    const pg = ctx.content.playground;
    const li = Math.min(Math.max(levelIdx, 0), pg.quizLevels.length - 1);
    const level = pg.quizLevels[li];
    const state = ctx.profile.quiz[li] || (ctx.profile.quiz[li] = { answers: {}, best: 0 });

    const tabs = pg.quizLevels.map((l, i) => {
        const locked = !levelUnlocked(ctx.profile, i);
        return locked ? `<span class="dim">🔒 ${escP(l.title)}</span>`
            : `<a class="${i === li ? 'amber' : ''}" href="#/playground/quiz/${i}">${escP(l.title)}</a>`;
    }).join(' · ');

    const pane = pgPane(`quiz · ${level.title}`);
    if (!levelUnlocked(ctx.profile, li)) {
        pane.body.innerHTML = `<p>${tabs}</p><p class="red">locked — score 6/8 on the previous level first.</p>`;
        el.append(pane.s); return;
    }
    const answered = Object.keys(state.answers).length;
    const correct = level.questions.filter((q, i) => state.answers[i] === q.answer).length;
    pane.body.innerHTML = `<p>${tabs} · <a href="#/playground">hub</a></p>` +
        `<p class="dim">${answered}/${level.questions.length} answered · ${correct} correct · best ${state.best}</p>` +
        `<div class="quiz-list"></div>` +
        `<p><button data-reset>retry level</button></p>`;
    const list = pane.body.querySelector('.quiz-list');
    level.questions.forEach((q, qi) => {
        const chosen = state.answers[qi];
        const div = document.createElement('div');
        div.className = 'quiz-q';
        div.innerHTML = `<p><b>Q${qi + 1}.</b> ${escP(q.q)}</p>` + q.options.map((opt, oi) => {
            const cls = chosen === undefined ? '' :
                oi === q.answer ? 'right' : oi === chosen ? 'wrong' : 'dim';
            return `<button class="quiz-opt ${cls}" data-q="${qi}" data-o="${oi}" ${chosen !== undefined ? 'disabled' : ''}>${escP(opt)}</button>`;
        }).join('') + (chosen !== undefined ? `<p class="quiz-why dim">${escP(q.why)}</p>` : '');
        list.append(div);
    });
    list.addEventListener('click', (e) => {
        const btn = e.target.closest('.quiz-opt');
        if (!btn || btn.disabled) return;
        state.answers[btn.dataset.q] = Number(btn.dataset.o);
        const nowCorrect = level.questions.filter((q, i) => state.answers[i] === q.answer).length;
        if (Object.keys(state.answers).length === level.questions.length) {
            state.best = Math.max(state.best, nowCorrect);
        }
        ctx.save();
        renderPlayground(el, ctx);
    });
    pane.body.querySelector('[data-reset]').addEventListener('click', () => {
        ctx.profile.quiz[li] = { answers: {}, best: state.best };
        ctx.save();
        renderPlayground(el, ctx);
    });
    el.append(pane.s);
}

// A resolved bug can show the real code as it stands today, straight out of the
// tree, when it carries an anchorId. ctx.data.excerpts is absent in unit contexts
// that never build them, so this stays optional at both ends.
function fixedExcerptHtml(ctx, bug) {
    const excerpt = bug.anchorId && (ctx.data.excerpts || []).find(e => e.id === bug.anchorId);
    if (!excerpt) return '';
    return `<p class="dim">${escP(excerpt.file)}:${excerpt.startLine} — today:</p>` +
        `<pre class="code">${highlightCode(excerpt.code)}</pre>`;
}

function renderBugs(el, ctx, bugId) {
    const bugs = ctx.content.playground.bugHunt;
    const bug = bugs.find(b => b.id === bugId) || bugs[0];
    const status = ctx.profile.bugs[bug.id];

    const list = pgPane('bug hunt · 7 true stories');
    list.body.innerHTML = '<p><a href="#/playground">hub</a></p><ul class="bug-list">' +
        bugs.map(b => {
            const st = ctx.profile.bugs[b.id];
            const mark = st === 'found' ? '<span class="accent">✓</span>'
                : st === 'revealed' ? '<span class="amber">◦</span>' : '<span class="dim">·</span>';
            return `<li>${mark} <a class="${b.id === bug.id ? 'amber' : ''}" href="#/playground/bugs/${b.id}">${escP(b.title)}</a></li>`;
        }).join('') + '</ul>' +
        '<p class="dim">Each panel reconstructs the code as it stood. Click the guilty line. One shot.</p>';

    const panel = pgPane(bug.title);
    const lines = bug.code.split('\n');
    // join('') deliberately: the lines are display:block, and a literal newline
    // between them inside a <pre> would render as an extra blank line.
    panel.body.innerHTML = `<p>${escP(bug.setup)}</p><pre class="code bug-code${status ? ' resolved' : ''}">` +
        lines.map((ln, i) => {
            const cls = status && i === bug.guiltyLine ? 'bug-line guilty' : 'bug-line';
            return `<span class="${cls}" data-line="${i}">${highlightCode(ln) || ' '}</span>`;
        }).join('') + '</pre>' +
        (status ? `<p class="${status === 'found' ? 'accent' : 'amber'}">` +
            `${status === 'found' ? 'found it.' : 'revealed — the guilty line is highlighted.'}</p>` +
            `<p class="bug-story">${escP(bug.story)}</p>` +
            `<p class="dim">lives on, fixed: <a href="#/code/${bug.fixedRef}"><code>${bug.fixedRef}</code></a></p>` +
            fixedExcerptHtml(ctx, bug)
          : '');
    if (!status) {
        panel.body.querySelector('.bug-code').addEventListener('click', (e) => {
            const line = e.target.closest('.bug-line');
            if (!line) return;
            ctx.profile.bugs[bug.id] = Number(line.dataset.line) === bug.guiltyLine ? 'found' : 'revealed';
            ctx.save();
            renderPlayground(el, ctx);
        });
    }
    el.append(list.s, panel.s);
}

function renderMerge(el, ctx) {
    const scenarios = ctx.content.playground.mergeScenarios;
    const lab = pgPane('merge lab · the engine the server enforces');
    lab.body.innerHTML =
        '<p><a href="#/playground">hub</a> · <span class="dim">this runs the REAL shared/diff.js, bundled at build time</span></p>' +
        `<p><select data-scenario>${scenarios.map(s => `<option value="${escP(s.name)}">${escP(s.name)}</option>`).join('')}</select>` +
        ' <button data-run>threeWayDiff</button> <button data-merge>merge (applyChangeSet)</button></p>' +
        '<p class="dim">The lab models the conflict gate only — the server also refuses on failed ' +
        'validation, a schema mismatch, a moved target head, or an oversized result.</p>' +
        '<p class="dim" data-blurb></p>' +
        '<div class="merge-grid">' +
        ['base', 'fork', 'upstream'].map(k =>
            `<div><div class="pane-subtitle">${k}</div><textarea data-${k} rows="14" spellcheck="false"></textarea></div>`
        ).join('') + '</div>' +
        '<div class="pane-subtitle">output</div><pre class="code merge-out">pick a scenario, edit the JSON, run.</pre>';

    const ta = { base: lab.body.querySelector('[data-base]'), fork: lab.body.querySelector('[data-fork]'),
                 upstream: lab.body.querySelector('[data-upstream]') };
    const out = lab.body.querySelector('.merge-out');
    const blurb = lab.body.querySelector('[data-blurb]');
    const load = (name) => {
        const s = scenarios.find(x => x.name === name) || scenarios[0];
        for (const k of ['base', 'fork', 'upstream']) ta[k].value = JSON.stringify(s[k], null, 2);
        blurb.textContent = s.blurb;
        out.textContent = 'pick a scenario, edit the JSON, run.';
    };
    // The panes are free-text: every failure has to land IN the output pane,
    // naming the pane at fault, never as an exception that kills the button.
    const parseAll = () => {
        const states = {};
        for (const k of ['base', 'fork', 'upstream']) {
            let parsed;
            try { parsed = JSON.parse(ta[k].value); }
            catch (err) { out.textContent = `${k}: JSON parse error — ${err.message}`; return null; }
            if (parsed === null || typeof parsed !== 'object' || Array.isArray(parsed)) {
                out.textContent = `${k}: expected a JSON object (a project state), got ${Array.isArray(parsed) ? 'an array' : String(parsed)}`;
                return null;
            }
            states[k] = parsed;
        }
        return states;
    };
    const show = (fn) => {
        const states = parseAll();
        if (!states) return;
        try { out.textContent = fn(states); }
        catch (err) { out.textContent = `engine error — ${err.message}`; }
    };
    const conflictLines = (conflicts) => conflicts.map(c => `  · [${c.kind}] ${c.description}`).join('\n');
    // A verdict must never outlive the panes it describes: typing invalidates it.
    // (load() assigns .value, which fires no input event, so presets are unaffected.)
    for (const k of ['base', 'fork', 'upstream']) {
        ta[k].addEventListener('input', () => { out.textContent = 'edited — run it again.'; });
    }
    lab.body.querySelector('[data-scenario]').addEventListener('change', (e) => load(e.target.value));
    lab.body.querySelector('[data-run]').addEventListener('click', () => show((s) => {
        const result = ctx.diff.threeWayDiff(s.base, s.fork, s.upstream);
        return (result.conflicts.length
            ? `⚠ ${result.conflicts.length} conflict(s):\n` + conflictLines(result.conflicts)
            : '✓ no conflicts — mergeable') +
            '\n\nfork changed:\n' + JSON.stringify(result.source, null, 2) +
            '\n\nupstream changed:\n' + JSON.stringify(result.target, null, 2);
    }));
    lab.body.querySelector('[data-merge]').addEventListener('click', () => show((s) => {
        const check = ctx.diff.threeWayDiff(s.base, s.fork, s.upstream);
        return check.conflicts.length
            ? `refused — ${check.conflicts.length} conflict(s), exactly like the merge endpoint would:\n` +
              conflictLines(check.conflicts)
            : 'merged state (fork changes replayed onto upstream):\n' +
              JSON.stringify(ctx.diff.applyChangeSet(s.base, s.fork, s.upstream), null, 2);
    }));
    load(scenarios[0].name);
    el.append(lab.s);
}

function renderWdil(el, ctx, wdilId) {
    const items = ctx.content.playground.wdil;
    const item = items.find(w => w.id === wdilId) || items[0];
    const state = ctx.profile.wdil[item.id] || (ctx.profile.wdil[item.id] = { tries: 0, done: false, failed: false });

    const list = pgPane('where does it live?');
    list.body.innerHTML = '<p><a href="#/playground">hub</a></p><ol class="wdil-list">' +
        items.map(w => {
            const st = ctx.profile.wdil[w.id];
            const mark = st?.done ? (st.failed ? '<span class="amber">◦</span>' : '<span class="accent">✓</span>')
                                  : '<span class="dim">·</span>';
            return `<li>${mark} <a class="${w.id === item.id ? 'amber' : ''}" href="#/playground/wdil/${w.id}">${escP(w.prompt)}</a></li>`;
        }).join('') + '</ol>';

    const game = pgPane(`find it · ${3 - state.tries} tries left`);
    game.body.innerHTML = `<p>${escP(item.prompt)}</p>` +
        (state.tries >= 1 && !state.done ? `<p class="amber">hint: ${escP(item.hint)}</p>` : '') +
        (state.done ? `<p class="${state.failed ? 'amber' : 'accent'}">` +
            (state.failed ? 'it lives in: ' : 'correct: ') +
            item.answers.map(a => `<a href="#/code/${a}"><code>${a}</code></a>`).join(' or ') + '</p>'
          : '<p class="dim">click the file in the tree.</p>') +
        `<nav class="tree wdil-tree"></nav>`;
    game.body.querySelector('.wdil-tree').innerHTML =
        treeHtml(ctx.data.tree, '', new Set(item.answers.map(a => a.split('/')[0])));
    if (!state.done) {
        game.body.querySelector('.wdil-tree').addEventListener('click', (e) => {
            const link = e.target.closest('a.tree-file');
            if (!link) return;
            e.preventDefault();
            const picked = link.getAttribute('href').replace('#/code/', '');
            if (item.answers.includes(picked)) { state.done = true; }
            else {
                state.tries += 1;
                if (state.tries >= 3) { state.done = true; state.failed = true; }
            }
            ctx.save();
            renderPlayground(el, ctx);
        });
    }
    el.append(list.s, game.s);
}

function renderPlayground(el, ctx) {
    el.innerHTML = '';
    const [section, arg] = ctx.route.parts;
    if (section === 'quiz') return renderQuiz(el, ctx, Number(arg) || 0);
    if (section === 'bugs') return renderBugs(el, ctx, arg);
    if (section === 'merge') return renderMerge(el, ctx);
    if (section === 'wdil') return renderWdil(el, ctx, arg);
    return renderHub(el, ctx);
}

// DOM glue. Pure logic lives in app-logic.mjs; render fns in render/*.mjs.
// After stripModuleSyntax + concatenation everything shares one IIFE scope.
(function initOnboarding() {
    const { data, content } = window.DOCTECT;
    let profile = loadProfile();

    const ctx = () => ({
        data, content, profile,
        save: () => saveProfile(profile),
        navigate: (hash) => { location.hash = hash; },
        route: parseHash(location.hash),
        diff: window.DoctectDiff,
    });

    const root = document.getElementById('root');
    const statusbar = document.getElementById('statusbar');
    const renderers = { intro: renderIntro, tours: renderTours, code: renderCode, playground: renderPlayground };

    const renderStatusbar = (active) => {
        statusbar.innerHTML = '';
        const session = document.createElement('span');
        session.className = 'session'; session.textContent = '[doctect]';
        statusbar.appendChild(session);
        WINDOWS.forEach((w, i) => {
            const tab = document.createElement('span');
            tab.className = 'wtab' + (w.id === active ? ' active' : '');
            tab.textContent = `${i + 1}:${w.label}${w.id === active ? '*' : ''}`;
            tab.onclick = () => { location.hash = buildHash(w.id); };
            statusbar.appendChild(tab);
        });
        const spacer = document.createElement('span'); spacer.className = 'spacer';
        const meta = document.createElement('span'); meta.className = 'meta';
        meta.textContent = `${data.vitals.gitSha} · ? for keys`;
        const clock = document.createElement('span'); clock.className = 'clock';
        clock.id = 'clock';
        statusbar.append(spacer, meta, clock);
    };

    const tickClock = () => {
        const el = document.getElementById('clock');
        if (el) el.textContent = new Date().toTimeString().slice(0, 5);
    };
    setInterval(tickClock, 10_000);

    const renderRoute = () => {
        const route = parseHash(location.hash);
        renderStatusbar(route.win);
        tickClock();
        root.innerHTML = '';
        renderers[route.win](root, ctx());
    };

    const help = document.getElementById('help');
    const toggleHelp = (force) => {
        const show = force !== undefined ? force : help.hidden;
        help.hidden = !show;
        if (show) help.innerHTML = '<h2>doctect onboarding — keys</h2><table>' +
            '<tr><td class="key">1–4</td><td>switch window</td></tr>' +
            '<tr><td class="key">?</td><td>toggle this help</td></tr>' +
            '<tr><td class="key">/</td><td>focus search (code window)</td></tr>' +
            '<tr><td class="key">Esc</td><td>close overlays</td></tr></table>';
    };

    document.addEventListener('keydown', (e) => {
        const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
        if (e.key === 'Escape') { toggleHelp(false); return; }
        if (inField) return;
        if (e.key >= '1' && e.key <= '4') location.hash = buildHash(WINDOWS[Number(e.key) - 1].id);
        else if (e.key === '?') toggleHelp();
        else if (e.key === '/') {
            const search = document.querySelector('[data-search]');
            if (search) { e.preventDefault(); search.focus(); }
        }
    });

    const boot = document.getElementById('boot');
    // Guarded: a bare call aborts this whole IIFE — and with it the entire page —
    // anywhere matchMedia is missing (jsdom, older embedded webviews).
    const reducedMotion = typeof matchMedia === 'function'
        && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const finishBoot = () => {
        boot.hidden = true;
        if (!profile.bootSeen) { profile.bootSeen = true; saveProfile(profile); }
    };
    if (!profile.bootSeen && !reducedMotion) {
        boot.hidden = false;
        const lines = [
            'connecting to doctect …',
            `· ${data.vitals.testFileCount} unit-test files · ${data.vitals.migrations.count} migrations · schema v${data.vitals.schemaVersion}`,
            '· gallery, forks, merge requests, layers, generator, docs',
            'attach: [doctect] session ready',
        ];
        const pre = document.getElementById('boot-lines');
        let li = 0, ci = 0;
        const timer = setInterval(() => {
            if (li >= lines.length) { clearInterval(timer); setTimeout(finishBoot, 500); return; }
            ci++;
            if (ci >= lines[li].length) { li++; ci = 0; }
            pre.textContent = lines.slice(0, li).join('\n') + (li < lines.length ? '\n' + lines[li].slice(0, ci) : '');
        }, 12);
        boot.addEventListener('click', () => { clearInterval(timer); finishBoot(); }, { once: true });
        document.addEventListener('keydown', function skip() {
            clearInterval(timer); finishBoot(); document.removeEventListener('keydown', skip);
        }, { once: true });
    } else if (!profile.bootSeen) {
        finishBoot();
    }

    window.addEventListener('hashchange', renderRoute);
    renderRoute();
})();

})();</script>
